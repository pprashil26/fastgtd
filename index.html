<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeblocks</title>
  <style>
    :root {
      --bg:#f6f3ee;
      --page:#fffdf8;
      --panel:#fbf7f0;
      --ink:#3d3a34;
      --muted:#8a8378;
      --line:#e7dfd4;
      --soft:#f1ebe2;
      --entry:#e8f0ec;
      --entry-border:#c8d8d0;
      --focus:#eef1e7;
      --evening:#f3ece7;
      --current:#fff3c7;
      --current-soft:#fff8df;
      --current-ink:#6f5b22;
      --selected:#dce8e1;
      --today:#f7e7bd;
      --saved-day:#eef5ee;
      --saved-day-border:#d4e3d8;
      --danger:#a56a62;
      --pin:#7a6a2a;
      --shadow:0 10px 28px rgba(70,55,35,.08);
      --radius-panel:16px;
      --radius-card:12px
    }
    * {
      box-sizing:border-box
    }
    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:13px;
      line-height:1.25;
      display:flex;
      justify-content:center;
      padding:10px 8px
    }
    .shell {
      width:100%;
      max-width:1280px;
      display:grid;
      grid-template-columns:230px minmax(0,780px) 230px;
      gap:10px;
      align-items:start;
      justify-content:center
    }
    .shell.left-collapsed,.shell.right-collapsed,.shell.left-collapsed.right-collapsed {
      grid-template-columns:230px minmax(0,780px) 230px
    }
    .sidebar,.notes-sidebar,.app {
      background:var(--page);
      border:1px solid var(--line);
      border-radius:var(--radius-panel);
      box-shadow:var(--shadow);
      overflow:hidden
    }
    .sidebar,.notes-sidebar {
      width:100%;
      transition:width .2s ease
    }
    .app {
      width:100%;
      max-width:780px
    }
    .sidebar-head,.notes-head,header,.expanded-note-head,.move-note-head {
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fffdf8 0%,#f8f3eb 100%)
    }
    .sidebar-head,.notes-head {
      min-height:42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:9px 10px 7px
    }
    .sidebar-title,.notes-title {
      font-size:13px;
      font-weight:650;
      color:var(--ink);
      white-space:nowrap
    }
    .plain-btn,.icon-btn {
      border:0;
      background:transparent;
      color:var(--muted);
      font:inherit;
      cursor:pointer
    }
    .plain-btn {
      font-size:12px;
      padding:1px 0
    }
    .plain-btn:hover {
      text-decoration:underline
    }
    .icon-btn {
      width:24px;
      height:24px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:7px;
      font-size:14px;
      line-height:1;
      text-decoration:none;
      transition:background .15s ease,color .15s ease,transform .12s ease
    }
    .icon-btn:hover {
      background:var(--soft);
      text-decoration:none
    }
    .icon-btn:active {
      transform:translateY(1px)
    }
    .icon-btn.pinned {
      color:var(--pin);
      font-weight:800;
      background:rgba(247,231,189,.42)
    }
    .icon-btn.delete-note-btn {
      color:var(--danger)
    }
    .calendar-wrap {
      max-height:calc(100vh - 80px);
      overflow:auto;
      padding:8px 8px 10px
    }
    .month {
      margin-bottom:11px
    }
    .month-name {
      font-size:11px;
      color:var(--muted);
      font-weight:700;
      margin:0 0 5px 2px;
      letter-spacing:.02em;
      text-transform:uppercase
    }
    .weekday-row,.days {
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:2px
    }
    .weekday {
      color:var(--muted);
      font-size:9.5px;
      font-weight:700;
      text-align:center;
      padding-bottom:2px;
      user-select:none
    }
    .day-spacer {
      min-height:23px
    }
    .day-btn {
      border:1px solid transparent;
      background:transparent;
      color:var(--ink);
      min-height:23px;
      border-radius:999px;
      font:inherit;
      font-size:11px;
      line-height:1;
      padding:2px 0;
      text-align:center;
      cursor:pointer
    }
    .day-btn:hover {
      background:var(--soft);
      text-decoration:none
    }
    .day-btn.weekend {
      color:var(--muted);
      background:rgba(231,223,212,.28)
    }
    .day-btn.has-data {
      background:var(--saved-day);
      border-color:var(--saved-day-border);
      color:var(--ink);
      font-weight:650
    }
    .day-btn.today {
      border-color:rgba(150,120,45,.38);
      background:var(--today);
      font-weight:700
    }
    .day-btn.selected {
      background:var(--selected);
      border-color:var(--entry-border);
      color:var(--ink);
      font-weight:800
    }
    .sidebar.collapsed,.notes-sidebar.collapsed {
      width:42px
    }
    .sidebar.collapsed .sidebar-head,.notes-sidebar.collapsed .notes-head {
      justify-content:center;
      padding-left:0;
      padding-right:0
    }
    .sidebar.collapsed .sidebar-title,.sidebar.collapsed .calendar-wrap,.notes-sidebar.collapsed .notes-title,.notes-sidebar.collapsed .notes-wrap {
      display:none
    }
    header {
      padding:9px 12px 7px
    }
    .title-row {
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      margin-bottom:4px
    }
    h1 {
      margin:0;
      font-size:18px;
      font-weight:650;
      letter-spacing:-.02em
    }
    .selected-date {
      color:var(--muted);
      font-size:12px;
      white-space:nowrap
    }
    .toolbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:11.5px
    }
    .hint {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }
    .actions {
      display:flex;
      gap:10px;
      align-items:center;
      white-space:nowrap
    }
    .clear-btn {
      color:var(--danger)
    }
    .note-block {
      padding:6px 11px;
      border-bottom:1px solid var(--line)
    }
    .note-block.bottom {
      border-top:1px solid var(--line);
      border-bottom:0;
      background:var(--panel)
    }
    .note-line {
      display:grid;
      grid-template-columns:68px 1fr;
      align-items:center;
      gap:8px
    }
    .note-label {
      color:var(--muted);
      font-size:11px;
      text-align:right;
      user-select:none
    }
    input[type=text],input[type=date] {
      width:100%;
      height:27px;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
      padding:5px 9px;
      color:var(--ink);
      font:inherit;
      font-size:12.5px;
      background:#fffdf8
    }
    input[type=text]:focus,input[type=date]:focus {
      border-color:var(--entry-border);
      background:var(--soft)
    }
    #focusInput {
      background:var(--focus)
    }
    #eveningInput {
      background:var(--evening)
    }
    .timeline {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0 12px;
      padding:6px 11px 7px
    }
    .column {
      min-width:0
    }
    .column:first-child {
      border-right:1px solid var(--line);
      padding-right:12px
    }
    .slot {
      display:grid;
      grid-template-columns:58px 18px 1fr;
      min-height:27px;
      border-bottom:1px solid var(--line);
      border-radius:8px;
      transition:background .2s ease
    }
    .slot:last-child {
      border-bottom:0
    }
    .slot.current-slot {
      background:var(--current);
      box-shadow:inset 0 0 0 1px rgba(150,120,45,.16)
    }
    .slot.current-slot .time {
      color:var(--current-ink);
      font-weight:750
    }
    .slot.current-slot textarea {
      background:var(--current-soft)
    }
    .slot.drop-ok {
      background:#e9f4ea;
      box-shadow:inset 0 0 0 1px #bdd5c2
    }
    .slot.drop-block {
      background:#f7ebe8;
      box-shadow:inset 0 0 0 1px #e2beb7
    }
    .time {
      padding:6px 8px 3px 2px;
      color:var(--ink);
      font-size:11px;
      font-weight:600;
      text-align:right;
      user-select:none
    }
    .drag-handle {
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:13px;
      cursor:grab;
      user-select:none;
      opacity:.72
    }
    .drag-handle:active {
      cursor:grabbing
    }
    textarea {
      width:100%;
      min-height:26px;
      height:26px;
      resize:none;
      border:0;
      outline:none;
      background:transparent;
      color:var(--ink);
      font:inherit;
      font-size:12px;
      padding:5px 8px 4px;
      border-left:1px solid var(--line);
      overflow:hidden
    }
    textarea:focus {
      background:var(--soft)
    }
    textarea.has-text {
      background:var(--entry);
      border-left:3px solid var(--entry-border);
      padding-left:6px
    }
    .slot.current-slot textarea.has-text {
      background:linear-gradient(0deg,rgba(232,240,236,.72),rgba(232,240,236,.72)),var(--current-soft)
    }
    footer {
      padding:5px 12px 7px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:10.5px;
      text-align:center;
      background:var(--panel)
    }
    .footer-actions {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap
    }
    .footer-separator {
      color:var(--line)
    }
    .backup-btn {
      font-size:10.5px;
      color:var(--muted)
    }
    .notes-wrap {
      padding:8px
    }
    .notes-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:8px
    }
    .notes-actions {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      white-space:nowrap;
      width:100%
    }
    .compact-btn {
      height:26px;
      padding:2px 8px;
      border-radius:8px
    }
    .compact-btn:hover {
      background:var(--soft);
      text-decoration:none
    }
    .compact-btn.active {
      color:var(--ink);
      font-weight:650;
      background:var(--soft)
    }
    .add-note-icon-btn {
      width:30px;
      height:30px;
      border-radius:10px;
      background:var(--entry);
      border:1px solid var(--entry-border);
      color:var(--ink);
      font-size:20px;
      font-weight:650;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0
    }
    .add-note-icon-btn:hover {
      background:#dfece5;
      text-decoration:none
    }
    .note-card {
      border:1px solid var(--line);
      border-radius:var(--radius-card);
      background:#fffdf8;
      margin-bottom:8px;
      overflow:hidden;
      transition:border-color .15s ease,background .15s ease
    }
    .note-card.is-pinned {
      border-color:#ded2a7;
      background:#fffdf6
    }
    .note-title-area {
      padding:8px 9px 3px;
      background:#fbf7f0
    }
    .note-tools-row {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:4px;
      min-height:30px;
      padding:2px 8px 5px;
      border-bottom:1px solid var(--line);
      background:#fbf7f0
    }
    .note-card.is-pinned .note-title-area,.note-card.is-pinned .note-tools-row {
      background:#fff8df
    }
    .note-title-input {
      height:25px;
      border:0;
      border-radius:0;
      background:transparent;
      padding:2px 0;
      font-size:12.5px;
      font-weight:650;
      min-width:0
    }
    .note-title-input:focus {
      background:transparent
    }
    .compact-expand-btn {
      display:none
    }
    .note-body {
      min-height:96px;
      height:96px;
      max-height:96px;
      border-left:0;
      resize:none;
      line-height:24px;
      padding:6px 9px;
      background-color:#fffdf8;
      background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,rgba(160,145,120,.24) 24px);
      overflow:hidden
    }
    .note-body:focus {
      background-color:#fffaf0
    }
    .notes-sidebar.notes-compact .note-title-area {
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:6px;
      padding:6px 8px
    }
    .notes-sidebar.notes-compact .compact-expand-btn {
      display:inline-flex
    }
    .notes-sidebar.notes-compact .note-tools-row,.notes-sidebar.notes-compact .note-body,.notes-sidebar.notes-compact .link-preview {
      display:none
    }
    .notes-sidebar.notes-compact .note-card {
      margin-bottom:5px
    }
    .notes-sidebar.notes-compact .note-title-input {
      height:24px;
      font-size:12.5px
    }
    .link-preview {
      padding:6px 9px 8px;
      border-top:1px solid var(--line);
      background:#fbf7f0
    }
    .link-preview-title {
      color:var(--muted);
      font-size:10.5px;
      font-weight:650;
      margin-bottom:4px
    }
    .link-preview-list {
      display:grid;
      gap:3px
    }
    .link-preview a {
      color:#516f64;
      font-size:11.5px;
      text-decoration:none;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }
    .link-preview a:hover {
      text-decoration:underline
    }
    .expanded-links {
      border-top:1px solid var(--line);
      max-height:110px;
      overflow:auto
    }
    .modal-backdrop {
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(61,58,52,.28);
      z-index:50
    }
    .modal-backdrop.open {
      display:flex
    }
    .expanded-note,.move-note-panel {
      background:var(--page);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 18px 50px rgba(50,40,28,.22);
      overflow:hidden
    }
    .expanded-note {
      width:min(420px,92vw);
      min-height:min(600px,82vh);
      max-height:88vh;
      display:flex;
      flex-direction:column
    }
    .expanded-note-head,.move-note-head {
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
      padding:10px 12px
    }
    .expanded-title {
      height:30px;
      border:0;
      border-radius:0;
      background:transparent;
      padding:3px 0;
      font-size:15px;
      font-weight:700
    }
    .expanded-title:focus {
      background:transparent
    }
    .expanded-note-tools {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:4px;
      min-height:32px;
      padding:3px 12px 5px;
      border-bottom:1px solid var(--line);
      background:var(--panel)
    }
    .expanded-note-tools .icon-btn {
      width:26px;
      height:26px
    }
    .expanded-note-tools .delete-note-btn {
      color:var(--danger)
    }
    .expanded-body {
      flex:1;
      min-height:460px;
      height:auto;
      resize:none;
      border:0;
      border-left:0;
      border-radius:0;
      line-height:26px;
      font-size:14px;
      padding:10px 14px;
      background-color:#fffdf8;
      background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,rgba(160,145,120,.24) 26px);
      overflow:auto
    }
    .expanded-body:focus {
      background-color:#fffaf0
    }
    .move-note-panel {
      width:min(340px,92vw)
    }
    .move-note-title {
      margin:0;
      font-size:15px;
      font-weight:700
    }
    .move-note-body {
      padding:12px
    }
    .move-note-body label {
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:5px
    }
    .move-note-actions {
      display:flex;
      justify-content:flex-end;
      gap:12px;
      padding:0 12px 12px
    }
    @media(max-width:1080px) and (min-width:760px) {
      .shell,.shell.left-collapsed,.shell.right-collapsed,.shell.left-collapsed.right-collapsed {
        grid-template-columns:210px minmax(0,1fr) 210px
      }
      .weekday {
        font-size:9px
      }
    }
    @media(max-width:759px) {
      body {
        padding:8px 6px
      }
      .shell,.shell.left-collapsed,.shell.right-collapsed,.shell.left-collapsed.right-collapsed {
        display:flex;
        flex-direction:column;
        max-width:100%
      }
      .sidebar,.notes-sidebar {
        width:100%;
        border-radius:14px
      }
      .sidebar {
        order:1;
        margin-bottom:8px
      }
      .notes-sidebar {
        order:2;
        margin-bottom:8px
      }
      .app {
        order:3;
        max-width:100%;
        border-radius:14px
      }
      .sidebar.collapsed,.notes-sidebar.collapsed {
        width:100%
      }
      .sidebar.collapsed .sidebar-title,.notes-sidebar.collapsed .notes-title {
        display:block
      }
      .sidebar.collapsed .calendar-wrap,.notes-sidebar.collapsed .notes-wrap {
        display:none
      }
      .sidebar-head,.notes-head {
        padding:8px 10px
      }
      .calendar-wrap {
        max-height:45vh
      }
      .title-row {
        gap:8px
      }
      h1 {
        font-size:17px
      }
      .selected-date {
        font-size:11.5px
      }
      .toolbar {
        font-size:11px
      }
      .note-line {
        grid-template-columns:56px 1fr
      }
      .timeline {
        display:block;
        padding:7px 10px 8px
      }
      .column:first-child {
        border-right:0;
        padding-right:0
      }
      .slot {
        grid-template-columns:52px 1fr;
        min-height:34px
      }
      .drag-handle {
        display:none
      }
      .time {
        font-size:10.5px;
        padding-top:9px
      }
      input[type=text],input[type=date],textarea {
        font-size:16px
      }
      input[type=text],input[type=date] {
        height:34px;
        padding:5px 9px
      }
      textarea {
        min-height:34px;
        height:34px;
        padding:7px 8px 5px
      }
      .note-title-input {
        height:32px;
        font-size:16px
      }
      .note-body {
        min-height:104px;
        height:104px;
        max-height:104px;
        line-height:26px;
        resize:none;
        overflow:hidden;
        background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,rgba(160,145,120,.24) 26px)
      }
      .notes-sidebar.notes-compact .note-title-input {
        height:30px;
        font-size:16px
      }
      .modal-backdrop {
        padding:10px
      }
      .expanded-note {
        width:100%;
        min-height:78vh;
        max-height:90vh;
        border-radius:16px
      }
      .expanded-title {
        height:34px;
        font-size:16px
      }
      .expanded-body {
        min-height:58vh;
        font-size:16px;
        line-height:28px;
        background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(160,145,120,.24) 28px)
      }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
   <aside aria-label="Compact calendar sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-head">
     <div class="sidebar-title">
      Calendar
     </div>
     <button aria-expanded="true" class="plain-btn" id="sidebarToggle" title="Show or hide calendar" type="button">
      Hide
     </button>
    </div>
    <div class="calendar-wrap" id="calendarWrap">
    </div>
   </aside>
   <main aria-label="Timeblocks daily planner" class="app">
    <header>
     <div class="title-row">
      <h1>
       Timeblocks
      </h1>
      <div class="selected-date" id="selectedDateText">
       Selected date
      </div>
     </div>
     <div class="toolbar">
      <div class="hint">
       8:00 AM to 8:00 PM · 30 min blocks
      </div>
      <div class="actions">
       <button class="plain-btn" id="todayBtn" title="Open today" type="button">
        Today
       </button>
       <button class="plain-btn clear-btn" id="clearBtn" title="Clear selected day's entries" type="button">
        Clear
       </button>
      </div>
     </div>
    </header>
    <section aria-label="Focus for the day" class="note-block">
     <div class="note-line">
      <label class="note-label" for="focusInput">
       Focus
      </label>
      <input autocomplete="off" id="focusInput" placeholder="Focus, critical reminder, intention..." type="text"/>
     </div>
    </section>
    <section class="timeline" id="timeline">
    </section>
    <section aria-label="Evening reminder" class="note-block bottom">
     <div class="note-line">
      <label class="note-label" for="eveningInput">
       Evening
      </label>
      <input autocomplete="off" id="eveningInput" placeholder="Evening commitment, reminder..." type="text"/>
     </div>
    </section>
    <footer>
     <span class="footer-actions">
      <span>Saved locally on this device</span>
      <span class="footer-separator">·</span>
      <button class="plain-btn backup-btn" id="exportBackupBtn" type="button" title="Download backup as text file">Export</button>
      <span class="footer-separator">·</span>

       let selectedDate=getInitialDate(), storageKey="", saved= {
      }, notes=[], draggedBox=null, expandedNoteId=null, movingNoteId=null, notesCompact=localStorage.getItem(COMPACT_KEY)==="true";
       function pad(v) {

      }

      }

        const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k||"");

      }

         function normalizeNotes(raw) {
          if(Array.isArray(raw))return raw.map(n=>( {

          }));

            id:createId(), title:"Note", body:raw, pinned:false
          }
          ];
          return[]
        }
        function orderNotes(list) {
          return list.filter(n=>n.pinned).concat(list.filter(n=>!n.pinned))
        }
        function readDateData(k) {

            }
          }

            }
          }
        }

        }
        function exportBackup() {
          const data={};
          for(let i=0;i<localStorage.length;i+=1) {
            const key=localStorage.key(i);
            if(!key || key===COMPACT_KEY || !/^timeblocks:\d{4}-\d{2}-\d{2}$/.test(key))continue;
            try {
              data[key]=JSON.parse(localStorage.getItem(key))
            }

              data[key]=localStorage.getItem(key)
            }
          }
          const backup={
            app:"Timeblocks",
            version:"1.0",
            exportedAt:new Date().toISOString(),
            preferences:{
              notesCompact:notesCompact
            },
            data:data
          };
          const blob=new Blob([JSON.stringify(backup, null, 2)], {type:"text/plain"});
          const url=URL.createObjectURL(blob);
          const anchor=document.createElement("a");
          anchor.href=url;
          anchor.download=backupFileName();
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url)
        }
        function isValidBackupData(data) {
          return data && typeof data==="object" && !Array.isArray(data)
        }
        function importBackupText(text) {
          let backup;

            backup=JSON.parse(text)
          }
          catch(error) {
            alert("This file is not a valid Timeblocks backup.");

          }
          if(!backup || backup.app!=="Timeblocks" || !isValidBackupData(backup.data)) {

            return
          }
          const entries=Object.entries(backup.data).filter(([key, value])=> {
            return /^timeblocks:\d{4}-\d{2}-\d{2}$/.test(key) && isValidBackupData(value)
          });
          if(!entries.length) {
            alert("No dated Timeblocks data was found in this backup.");

          if(!ok)return;
          entries.forEach(([key, value])=> {
            localStorage.setItem(key, JSON.stringify(value))
          });
          if(backup.preferences && typeof backup.preferences.notesCompact==="boolean") {
            notesCompact=backup.preferences.notesCompact;
            localStorage.setItem(COMPACT_KEY, String(notesCompact));
            applyNotesCompact()
          }
          buildCalendar();
          loadSelectedDate();
          alert(`Imported ${entries.length} saved date(s).`)
        }
        function readSavedData() {
          storageKey=selectedStorageKey();
          saved=readDateData(toKey(selectedDate));
          notes=orderNotes(normalizeNotes(saved.notes))
        }
        function hasNotesData(d) {
          return Array.isArray(d.notes)?d.notes.some(n=>(n.title||"").trim()||(n.body||"").trim()):Boolean((d.notes||"").trim())
        }
        function hasSavedDataForDate(k) {
          try {
            const d=readDateData(k);
            return Boolean((d.focus||"").trim())||Boolean((d.evening||"").trim())||d.entries&&Object.keys(d.entries).length>0||hasNotesData(d)
          }
          catch(e) {
            return false
          }
        }
        function collectNotes() {
          return Array.from(document.querySelectorAll(".note-card")).map(c=>( {
            id:c.dataset.id, title:c.querySelector(".note-title-input").value, body:c.querySelector(".note-body").value, pinned:c.dataset.pinned==="true"
          }))
        }
        function collectEntries() {
          const entries= {
          };

            if(b.value.trim())entries[b.dataset.time]=b.value
          });
          return entries
        }
        function currentDateDataFromDom() {

            focus:focusInput.value, evening:eveningInput.value, notes:collectNotes(), entries:collectEntries()
          }
        }

        }
        function markDateHasData(k) {

         function applyNotesCompact() {

          compactNotesBtn.title=notesCompact?"Show note previews":"Hide note previews"
        }
        function autoGrow(b) {

          b.style.height=h+"px";
          b.style.height=Math.max(h, b.scrollHeight)+"px";

        }

        }
        function clearDropClasses() {
          document.querySelectorAll(".slot.drop-ok,.slot.drop-block").forEach(s=>s.classList.remove("drop-ok", "drop-block"))
        }
         function createSlot(total) {
          const h=Math.floor(total/60), m=total%60, id=`${pad(h)}:${pad(m)}`, slot=document.createElement("div");
          slot.className="slot";
          slot.dataset.time=id;
          const label=document.createElement("div");
          label.className="time";
          label.textContent=formatTime(h, m);
          const handle=document.createElement("div");
          handle.className="drag-handle";

          handle.draggable=true;
          const box=document.createElement("textarea");
          box.dataset.time=id;
          box.value=saved.entries&&saved.entries[id]||saved[id]||"";

          handle.addEventListener("dragstart", e=> {
            if(!isDesktopDragEnabled()||!box.value.trim()) {

            }

        function buildTimeline() {

          total<=20*60;

        }
         function createNoteCard(note) {
          const card=document.createElement("section");
          card.className="note-card";

          const toolsRow=document.createElement("div");

          const expandButton=document.createElement("button");

          const moveButton=document.createElement("button");

        function getNoteCardById(id) {

          const card=getNoteCardById(id);

          if(expandedNoteId===id)closeExpandedEditor();

        function updateExpandedToolbar() {

        function insertMovedNote(targetNotes, note) {
          if(note.pinned) {
            targetNotes.unshift(note);
            return orderNotes(targetNotes)
          }
          const firstNormal=targetNotes.findIndex(n=>!n.pinned);
          if(firstNormal===-1)targetNotes.push(note);
          else targetNotes.splice(firstNormal, 0, note);
          return orderNotes(targetNotes)
        }
        function moveNoteToDate() {
          if(!movingNoteId)return;
          const targetKey=moveDateInput.value, targetDate=fromKey(targetKey);
          if(!targetDate||!isWithinRange(targetDate)) {
            alert("Please select a date between 1 July 2026 and 31 December 2027.");
            return
          }
          const sourceKey=toKey(selectedDate);
          if(targetKey===sourceKey) {
            alert("Please select a different date.");
            return
          }
          if(expandedNoteId===movingNoteId)closeExpandedEditor();
          const current=collectNotes(), sourceIndex=current.findIndex(n=>n.id===movingNoteId);
          if(sourceIndex===-1)return;
          const[movingNote]=current.splice(sourceIndex, 1), sourceData=currentDateDataFromDom();

        }
        function renderNotes() {
          notesList.innerHTML="";
          notes=orderNotes(notes);
          notes.forEach(n=>notesList.appendChild(createNoteCard(n)));
          document.querySelectorAll(".note-body").forEach(autoGrowNoteBody);
          applyNotesCompact()
        }
         function highlightCurrentTimeBlock() {
          document.querySelectorAll(".slot.current-slot").forEach(s=>s.classList.remove("current-slot"));
          const today=getToday();
          if(!isSameDay(selectedDate, today))return;
          const c=new Date, mins=c.getHours()*60+c.getMinutes();
          if(mins<8*60||mins>20*60)return;
          const rounded=Math.floor(mins/30)*30,
           timeId=`${pad(Math.floor(rounded/60))}:${pad(rounded%60)}`,
          slot=document.querySelector(`.slot[data-time="${timeId}"]`);
          if(slot)slot.classList.add("current-slot")
        }
        function loadSelectedDate() {
          readSavedData();
          selectedDateText.textContent=displayDate(selectedDate);
          focusInput.value=saved.focus||"";
          eveningInput.value=saved.evening||"";
          buildTimeline();
          renderNotes();
          updateSelectedCalendarDay();
          highlightCurrentTimeBlock()
        }
        function selectDate(date, updateHash) {
          if(!isWithinRange(date))return;
          if(noteModal.classList.contains("open"))closeExpandedEditor();
          if(moveModal.classList.contains("open"))closeMoveNote();
          selectedDate=new Date(date.getFullYear(), date.getMonth(), date.getDate());
          if(updateHash)history.replaceState(null, "", `#${toKey(selectedDate)}`);
          loadSelectedDate()
        }
        function updateSelectedCalendarDay() {
          const selectedKey=toKey(selectedDate);
          document.querySelectorAll(".day-btn.selected").forEach(b=>b.classList.remove("selected"));
          const b=document.querySelector(`.day-btn[data-date="${selectedKey}"]`);
          if(b) {
            b.classList.add("selected");
            b.scrollIntoView( {
              block:"nearest"
            })
          }
        }
        function addWeekdayHeader(month) {
          const row=document.createElement("div");
          row.className="weekday-row";
          WEEKDAYS.forEach(dayName=> {
            const h=document.createElement("div");
            h.className="weekday";
            h.textContent=dayName;
            row.appendChild(h)
          });
          month.appendChild(row)
        }
        function addBlankDay(days) {
          const spacer=document.createElement("div");
          spacer.className="day-spacer";
          spacer.setAttribute("aria-hidden", "true");
          days.appendChild(spacer)
        }
        function buildCalendar() {
          calendarWrap.innerHTML="";
          const todayKey=toKey(getToday());
          let cursor=new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);
          while(cursor<=END_DATE) {
            const month=document.createElement("section");
            month.className="month";
            const heading=document.createElement("div");
            heading.className="month-name";
            heading.textContent=monthName(cursor);
            const days=document.createElement("div");
            days.className="days";
            const monthIndex=cursor.getMonth(), year=cursor.getFullYear(), firstDay=new Date(year, monthIndex, 1), day=new Date(year, monthIndex, 1);
            for(let i=0;
            i<mondayFirstIndex(firstDay);
            i++)addBlankDay(days);
            while(day.getMonth()===monthIndex) {
              if(day>=START_DATE&&day<=END_DATE) {
                const key=toKey(day), btn=document.createElement("button");
                btn.className="day-btn";
                btn.type="button";
                btn.textContent=day.getDate();
                btn.dataset.date=key;
                btn.title=displayDate(day);
                if(day.getDay()===0||day.getDay()===6)btn.classList.add("weekend");
                if(hasSavedDataForDate(key))btn.classList.add("has-data");
                if(key===todayKey)btn.classList.add("today");
                if(key===toKey(selectedDate))btn.classList.add("selected");
                btn.addEventListener("click", function() {
                  const d=fromKey(this.dataset.date);
                  if(d)selectDate(d, true)
                });
                days.appendChild(btn)
              }
              else addBlankDay(days);
              day.setDate(day.getDate()+1)
            }
            month.append(heading);
            addWeekdayHeader(month);
            month.append(days);
            calendarWrap.append(month);
            cursor.setMonth(cursor.getMonth()+1)
          }
        }
         focusInput.addEventListener("input", save);
        eveningInput.addEventListener("input", save);
        compactNotesBtn.addEventListener("click", ()=> {
          notesCompact=!notesCompact;
          localStorage.setItem(COMPACT_KEY, String(notesCompact));
          applyNotesCompact()
        });
        addNoteBtn.addEventListener("click", ()=> {
          const newNote= {
            id:createId(), title:"New Note", body:"", pinned:false
          };
          notes.unshift(newNote);
          renderNotes();
          save();
          openExpandedNote(newNote.id);
          expandedTitle.focus();
          expandedTitle.select()
        });
        expandedTitle.addEventListener("input", syncExpandedToCard);
        expandedBody.addEventListener("input", syncExpandedToCard);
        expandedPinBtn.addEventListener("click", ()=> {
          if(expandedNoteId)togglePin(expandedNoteId)
        });
        expandedMoveBtn.addEventListener("click", ()=> {
          if(expandedNoteId)openMoveNote(expandedNoteId)
        });
        expandedDeleteBtn.addEventListener("click", ()=> {
          if(expandedNoteId)deleteNoteById(expandedNoteId)
        });
        closeExpandedNote.addEventListener("click", closeExpandedEditor);
        noteModal.addEventListener("click", e=> {
          if(e.target===noteModal)closeExpandedEditor()
        });
        cancelMoveTop.addEventListener("click", closeMoveNote);
        cancelMoveBtn.addEventListener("click", closeMoveNote);
        confirmMoveBtn.addEventListener("click", moveNoteToDate);
        moveModal.addEventListener("click", e=> {
          if(e.target===moveModal)closeMoveNote()
        });
        document.addEventListener("keydown", e=> {
          if(e.key==="Escape") {
            if(noteModal.classList.contains("open"))closeExpandedEditor();
            if(moveModal.classList.contains("open"))closeMoveNote()
          }
        });
        clearBtn.addEventListener("click", ()=> {
          if(!confirm(`Clear all entries for ${displayDate(selectedDate)}?`))return;
          if(noteModal.classList.contains("open"))closeExpandedEditor();
          if(moveModal.classList.contains("open"))closeMoveNote();
          localStorage.removeItem(storageKey);
          focusInput.value="";
          eveningInput.value="";
          notes=[];
          renderNotes();
          document.querySelectorAll("textarea[data-time]").forEach(b=> {
            b.value="";
            autoGrow(b)
          });
          markDateHasData(toKey(selectedDate));
          highlightCurrentTimeBlock()
        });
        todayBtn.addEventListener("click", ()=> {
          const today=getToday();
          if(isWithinRange(today))selectDate(today, true)
        });
        exportBackupBtn.addEventListener("click", exportBackup);
        importBackupBtn.addEventListener("click", ()=> {
          importBackupInput.value="";
          importBackupInput.click()
        });
        importBackupInput.addEventListener("change", ()=> {
          const file=importBackupInput.files && importBackupInput.files[0];
          if(!file)return;
          const reader=new FileReader();
          reader.onload=()=>importBackupText(String(reader.result || ""));
          reader.onerror=()=>alert("Could not read the selected backup file.");
          reader.readAsText(file)
        });
        sidebarToggle.addEventListener("click", ()=> {
          const collapsed=sidebar.classList.toggle("collapsed");
          shell.classList.toggle("left-collapsed", collapsed);
          sidebarToggle.textContent=collapsed?"Show":"Hide";
          sidebarToggle.setAttribute("aria-expanded", String(!collapsed))
        });
        notesToggle.addEventListener("click", ()=> {
          const collapsed=notesSidebar.classList.toggle("collapsed");
          shell.classList.toggle("right-collapsed", collapsed);
          notesToggle.textContent=collapsed?"Show":"Hide";
          notesToggle.setAttribute("aria-expanded", String(!collapsed))
        });
        window.addEventListener("resize", ()=> {
          document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
          document.querySelectorAll(".note-body").forEach(autoGrowNoteBody)
        });
        window.addEventListener("hashchange", ()=> {
          const hashDate=fromKey(location.hash.replace("#", ""));
          if(hashDate&&isWithinRange(hashDate))selectDate(hashDate, false)
        });
        applyNotesCompact();
        buildCalendar();
        loadSelectedDate();
        history.replaceState(null, "", `#${toKey(selectedDate)}`);
        setInterval(highlightCurrentTimeBlock, 60000)
      })();
  </script>
</body>
</html>
