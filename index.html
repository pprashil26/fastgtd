<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's plan</title>
  <style>
    :root {
           --bg:#f6f3ee;
          --page:#fffdf8;
          --panel:#fbf7f0;
          --ink:#3d3a34;
          --muted:#8a8378;
          --line:#e7dfd4;
          --soft:#f1ebe2;
           --entry:#e8f0ec;
          --entry-border:#c8d8d0;
          --focus:#eef1e7;
          --current:#fff3c7;
          --current-soft:#fff8df;
           --current-ink:#6f5b22;
          --selected:#dce8e1;
          --today:#f7e7bd;
          --saved-day:#eef5ee;
          --saved-day-border:#d4e3d8;
           --danger:#a56a62;
          --pin:#7a6a2a;
          --shadow:0 10px 28px rgba(70, 55, 35, .08);
          --radius-panel:16px;
          --radius-card:12px;
           --font-xs:11px;
          --font-sm:12px;
          --font-md:13px;
          --font-lg:15px;
          --font-title:18px;
        }
         * {
           box-sizing:border-box;
        }
         body {
           margin:0;
           min-height:100vh;
           background:var(--bg);
           color:var(--ink);
           font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           font-size:var(--font-md);
           line-height:1.35;
           display:flex;
           flex-direction:column;
           align-items:center;
           padding:10px 8px;
           -webkit-font-smoothing:antialiased;
           text-rendering:optimizeLegibility;
        }
         button,
        input,
        textarea {
           font:inherit;
        }
         .plain-btn,
        .icon-btn {
           border:0;
           background:transparent;
           color:var(--muted);
           cursor:pointer;
           font-weight:500;
        }
         .plain-btn {
           font-size:var(--font-sm);
           padding:1px 0;
        }
         .plain-btn:hover {
           text-decoration:underline;
        }
         .icon-btn {
           width:24px;
           height:24px;
           display:inline-flex;
           align-items:center;
           justify-content:center;
           border-radius:7px;
           font-size:14px;
           line-height:1;
           text-decoration:none;
        }
         .icon-btn:hover {
           background:var(--soft);
           text-decoration:none;
        }
         .icon-btn.pinned {
           color:var(--pin);
           font-weight:700;
           background:rgba(247, 231, 189, .42);
        }
         .icon-btn.delete-note-btn,
        .clear-btn {
           color:var(--danger);
        }
         .global-search-wrap {
           width:100%;
           max-width:1280px;
           margin-bottom:10px;
        }
         .global-search-box {
           background:var(--page);
           border:1px solid var(--line);
           border-radius:var(--radius-panel);
           box-shadow:var(--shadow);
           padding:8px 10px;
           display:grid;
           grid-template-columns:1fr auto;
           gap:8px;
           align-items:center;
        }
         .global-search-box input {
           height:30px;
           border:0;
           outline:0;
           background:transparent;
           color:var(--ink);
           font-size:var(--font-md);
           min-width:0;
        }
         .global-search-clear {
           width:28px;
           height:28px;
           border-radius:8px;
           background:var(--soft);
           color:var(--muted);
           padding:0;
           display:none;
           align-items:center;
           justify-content:center;
        }
         .global-search-clear.show {
           display:inline-flex;
        }
         .global-results {
           display:none;
           width:100%;
           max-width:780px;
           background:var(--page);
           border:1px solid var(--line);
           border-radius:var(--radius-panel);
           box-shadow:var(--shadow);
           overflow:hidden;
        }
         body.global-search-active .global-results {
           display:block;
        }
         body.global-search-active .shell {
           display:none;
        }
         .global-results-head {
           padding:10px 12px;
           border-bottom:1px solid var(--line);
           background:linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
           font-size:var(--font-md);
           font-weight:650;
        }
         .global-results-list {
           padding:8px;
        }
         .global-result-card {
           width:100%;
           text-align:left;
           border:1px solid var(--line);
           border-radius:12px;
           background:#fffdf8;
           color:var(--ink);
           padding:8px 9px;
           margin-bottom:7px;
           cursor:pointer;
           font:inherit;
        }
         .global-result-card:hover {
           background:var(--soft);
        }
         .global-result-date {
           color:var(--muted);
           font-size:var(--font-xs);
           margin-bottom:3px;
        }
         .global-result-title {
           font-weight:650;
           font-size:var(--font-md);
           margin-bottom:3px;
           overflow:hidden;
           text-overflow:ellipsis;
           white-space:nowrap;
        }
         .global-result-preview {
           color:var(--muted);
           font-size:11.5px;
           display:-webkit-box;
           -webkit-line-clamp:2;
           -webkit-box-orient:vertical;
           overflow:hidden;
        }
         .mobile-home,
        .mobile-section-bar {
           display:none;
        }
         .shell {
           width:100%;
           max-width:1280px;
           display:grid;
           grid-template-columns:230px minmax(0, 780px) 230px;
           gap:10px;
           align-items:start;
           justify-content:center;
        }
         .shell.left-collapsed,
        .shell.right-collapsed,
        .shell.left-collapsed.right-collapsed {
           grid-template-columns:230px minmax(0, 780px) 230px;
        }
         .sidebar,
        .notes-sidebar,
        .app {
           background:var(--page);
           border:1px solid var(--line);
           border-radius:var(--radius-panel);
           box-shadow:var(--shadow);
           overflow:hidden;
        }
         .sidebar,
        .notes-sidebar {
           width:100%;
           transition:width .2s ease;
        }
         .app {
           width:100%;
           max-width:780px;
        }
         .sidebar-head,
        .notes-head,
        header,
        .expanded-note-head,
        .move-note-head {
           border-bottom:1px solid var(--line);
           background:linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
        }
         .sidebar-head,
        .notes-head {
           min-height:42px;
           display:flex;
           align-items:center;
           justify-content:space-between;
           gap:8px;
           padding:9px 10px 7px;
        }
         .sidebar-title,
        .notes-title {
           font-size:var(--font-md);
           font-weight:650;
           color:var(--ink);
           white-space:nowrap;
        }
         .calendar-wrap {
           max-height:calc(100vh - 80px);
           overflow:auto;
           padding:8px 8px 10px;
        }
         .month {
           margin-bottom:11px;
        }
         .month-name {
           font-size:var(--font-xs);
           color:var(--muted);
           font-weight:650;
           margin:0 0 5px 2px;
           letter-spacing:.02em;
           text-transform:uppercase;
        }
         .weekday-row,
        .days {
           display:grid;
           grid-template-columns:repeat(7, 1fr);
           gap:2px;
        }
         .weekday {
           color:var(--muted);
           font-size:10px;
           font-weight:650;
           text-align:center;
           padding-bottom:2px;
           user-select:none;
        }
         .day-spacer {
           min-height:23px;
        }
         .day-btn {
           border:1px solid transparent;
           background:transparent;
           color:var(--ink);
           min-height:23px;
           border-radius:999px;
           font:inherit;
           font-size:var(--font-xs);
           line-height:1;
           padding:2px 0;
           text-align:center;
           cursor:pointer;
           font-variant-numeric:tabular-nums;
        }
         .day-btn:hover {
           background:var(--soft);
           text-decoration:none;
        }
         .day-btn.weekend {
           color:var(--muted);
           background:rgba(231, 223, 212, .28);
        }
         .day-btn.has-data {
           background:var(--saved-day);
           border-color:var(--saved-day-border);
           color:var(--ink);
           font-weight:650;
        }
         .day-btn.today {
           border-color:rgba(150, 120, 45, .38);
           background:var(--today);
           font-weight:700;
        }
         .day-btn.selected {
           background:var(--selected);
           border-color:var(--entry-border);
           color:var(--ink);
           font-weight:700;
        }
         .sidebar.collapsed,
        .notes-sidebar.collapsed {
           width:42px;
        }
         .sidebar.collapsed .sidebar-head,
        .notes-sidebar.collapsed .notes-head {
           justify-content:center;
           padding-left:0;
           padding-right:0;
        }
         .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .calendar-wrap,
        .notes-sidebar.collapsed .notes-title,
        .notes-sidebar.collapsed .notes-wrap {
           display:none;
        }
         header {
           padding:9px 12px 7px;
        }
         .title-row {
           display:flex;
           align-items:baseline;
           justify-content:space-between;
           gap:10px;
           margin-bottom:4px;
        }
         h1 {
           margin:0;
           font-size:var(--font-title);
           font-weight:650;
           letter-spacing:-.02em;
        }
         .date-nav {
           display:inline-flex;
           align-items:center;
           gap:6px;
           min-width:0;
        }
         .selected-date {
           color:var(--muted);
           font-size:var(--font-sm);
           white-space:nowrap;
        }
         .nav-day-btn {
           width:24px;
           height:24px;
           border-radius:8px;
           display:inline-flex;
           align-items:center;
           justify-content:center;
           padding:0;
           font-size:17px;
           line-height:1;
        }
         .nav-day-btn:hover {
           background:var(--soft);
           text-decoration:none;
        }
         .nav-day-btn:disabled {
           opacity:.35;
           cursor:default;
        }
         .toolbar {
           display:flex;
           justify-content:space-between;
           align-items:center;
           gap:10px;
           color:var(--muted);
           font-size:var(--font-xs);
        }
         .hint {
           overflow:hidden;
           text-overflow:ellipsis;
           white-space:nowrap;
        }
         .actions {
           display:flex;
           gap:10px;
           align-items:center;
           white-space:nowrap;
        }
         .note-block {
           padding:6px 11px;
           border-bottom:1px solid var(--line);
        }
         .note-line {
           display:grid;
           grid-template-columns:68px 1fr;
           align-items:center;
           gap:8px;
        }
         .note-label {
           color:var(--muted);
           font-size:var(--font-xs);
           font-weight:500;
           text-align:right;
           user-select:none;
        }
         input[type="text"],
        input[type="date"] {
           width:100%;
           height:27px;
           border:1px solid var(--line);
           border-radius:10px;
           outline:none;
           padding:5px 9px;
           color:var(--ink);
           font-size:12.5px;
           background:#fffdf8;
        }
         input[type="text"]:focus,
        input[type="date"]:focus {
           border-color:var(--entry-border);
           background:var(--soft);
        }
         #focusInput {
           background:var(--focus);
        }
         .task-done .timeline {
           display:grid;
           gap:3px;
           padding:5px 10px 6px;
        }
         .time-pair-row {
           display:grid;
           grid-template-columns:1fr 1fr;
           gap:6px;
           border-bottom:1px solid var(--line);
           padding-bottom:3px;
        }
         .time-pair-row:last-child {
           border-bottom:0;
           padding-bottom:0;
        }
         .slot {
           display:grid;
           grid-template-columns:42px 16px 1fr;
           min-height:24px;
           border-radius:8px;
           transition:background .2s ease;
           background:#fffdf8;
        }
         .slot.current-slot {
           background:var(--current);
           box-shadow:inset 0 0 0 1px rgba(150, 120, 45, .16);
        }
         .slot.current-slot .time {
           color:var(--current-ink);
           font-weight:700;
        }
         .slot.current-slot textarea {
           background:var(--current-soft);
        }
         .slot.drop-ok {
           background:#e9f4ea;
           box-shadow:inset 0 0 0 1px #bdd5c2;
        }
         .slot.drop-block {
           background:#f7ebe8;
           box-shadow:inset 0 0 0 1px #e2beb7;
        }
         .time {
           padding:5px 5px 2px 2px;
           color:var(--ink);
           font-size:10.5px;
           font-weight:600;
           text-align:right;
           user-select:none;
           font-variant-numeric:tabular-nums;
        }
         .half-slot .time {
           color:rgba(138, 131, 120, .62);
           font-weight:500;
        }
         .half-slot textarea {
           border-left-color:rgba(231, 223, 212, .6);
        }
         .drag-handle {
           display:flex;
           align-items:center;
           justify-content:center;
           color:var(--muted);
           font-size:12px;
           cursor:grab;
           user-select:none;
           opacity:.72;
        }
         textarea {
           width:100%;
           min-height:24px;
           height:24px;
           resize:none;
           border:0;
           outline:none;
           background:transparent;
           color:var(--ink);
           font-size:12px;
           padding:4px 7px 3px;
           border-left:1px solid var(--line);
           overflow:hidden;
        }
         textarea:focus {
           background:var(--soft);
        }
         textarea.has-text {
           background:var(--entry);
           border-left:3px solid var(--entry-border);
           padding-left:6px;
        }
         .slot.current-slot textarea.has-text {
           background:linear-gradient(0deg, rgba(232, 240, 236, .72), rgba(232, 240, 236, .72)), var(--current-soft);
        }
         .evening-planner {
           display:block;
           border-top:1px solid var(--line);
           background:var(--panel);
           padding:8px 11px 10px;
        }
         .evening-label {
           display:block;
           color:var(--muted);
           font-size:var(--font-xs);
           font-weight:600;
           margin:0 0 5px 2px;
        }
         .evening-textarea {
           min-height:110px;
           height:110px;
           line-height:26px;
           font-size:var(--font-md);
           border:1px solid var(--line);
           border-radius:12px;
           border-left:1px solid var(--line);
           padding:7px 10px;
           resize:none;
           background-color:#fffdf8;
           background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 25px, rgba(160, 145, 120, .24) 26px);
           overflow:hidden;
        }
         .evening-textarea:focus {
           background-color:#fffaf0;
           border-color:var(--entry-border);
        }
         footer {
           padding:5px 12px 7px;
           border-top:1px solid var(--line);
           color:var(--muted);
           font-size:10.5px;
           text-align:center;
           background:var(--panel);
        }
         .footer-actions {
           display:inline-flex;
           align-items:center;
           justify-content:center;
           gap:8px;
           flex-wrap:wrap;
        }
         .footer-separator {
           color:var(--line);
        }
         .backup-btn {
           font-size:10.5px;
           color:var(--muted);
        }
         .notes-wrap {
           padding:8px;
        }
         .mobile-notes-date {
           display:none;
           color:var(--muted);
           font-size:11.5px;
           margin:0 0 8px 2px;
        }
         .notes-top {
           display:flex;
           align-items:center;
           gap:8px;
           margin-bottom:8px;
        }
         .notes-actions {
           display:flex;
           align-items:center;
           justify-content:flex-end;
           gap:8px;
           white-space:nowrap;
           width:100%;
           position:relative;
        }
         .compact-btn {
           height:auto;
           padding:1px 0;
           border-radius:0;
        }
         .move-all-btn,
        .bin-btn {
           height:26px;
           padding:2px 8px;
           border-radius:8px;
        }
         .compact-btn:hover {
           background:transparent;
           text-decoration:underline;
        }
         .move-all-btn:hover,
        .bin-btn:hover,
        .search-btn:hover {
           background:var(--soft);
           text-decoration:none;
        }
         .compact-btn.active {
           color:var(--ink);
           font-weight:650;
           background:transparent;
        }
         .bin-btn.active {
           color:var(--ink);
           font-weight:650;
           background:var(--soft);
        }
         .bin-back-btn {
           display:none;
           height:auto;
           padding:1px 0;
           border-radius:0;
           color:var(--ink);
           font-weight:650;
        }
         .notes-sidebar.bin-open .bin-back-btn {
           display:inline-flex;
        }
         .notes-sidebar.bin-open .compact-btn,
        .notes-sidebar.bin-open .add-note-icon-btn {
           display:none;
        }
         .search-btn {
           width:32px;
           height:30px;
           border-radius:9px;
           display:inline-flex;
           align-items:center;
           justify-content:center;
           padding:0;
           font-size:18px;
           font-weight:700;
           line-height:1;
           text-decoration:none;
        }
         .search-btn.active {
           color:var(--ink);
           background:var(--soft);
        }
         .notes-search-row {
           display:none;
           grid-template-columns:1fr auto;
           gap:6px;
           margin-bottom:8px;
        }
         .notes-search-row.open {
           display:grid;
        }
         .notes-search-row input[type="text"] {
           height:30px;
           font-size:12.5px;
        }
         .search-clear-btn {
           width:30px;
           height:30px;
           border-radius:8px;
           background:var(--soft);
           color:var(--muted);
           padding:0;
        }
         .no-results {
           display:none;
           color:var(--muted);
           font-size:11.5px;
           text-align:center;
           padding:8px 4px;
        }
         .no-results.show {
           display:block;
        }
         .add-note-icon-btn {
           width:auto;
           height:auto;
           border-radius:0;
           background:transparent;
           border:0;
           color:var(--muted);
           font-size:20px;
           font-weight:650;
           line-height:1;
           display:inline-flex;
           align-items:center;
           justify-content:center;
           padding:1px 0;
        }
         .add-note-icon-btn:hover {
           background:transparent;
           color:var(--ink);
           text-decoration:underline;
        }
         .notes-more-wrap {
           position:relative;
           display:inline-flex;
        }
         .more-btn {
           width:30px;
           height:30px;
           border-radius:10px;
           background:transparent;
           border:1px solid transparent;
           color:var(--muted);
           font-size:20px;
           line-height:1;
           display:inline-flex;
           align-items:center;
           justify-content:center;
           padding:0;
        }
         .more-btn:hover,
        .more-btn.active {
           background:var(--soft);
           text-decoration:none;
           color:var(--ink);
        }
         .notes-more-menu {
           display:none;
           position:absolute;
           top:34px;
           right:0;
           min-width:145px;
           padding:6px;
           background:var(--page);
           border:1px solid var(--line);
           border-radius:12px;
           box-shadow:0 14px 34px rgba(70, 55, 35, .14);
           z-index:20;
        }
         .notes-more-menu.open {
           display:grid;
           gap:3px;
        }
         .notes-more-menu .plain-btn {
           width:100%;
           height:28px;
           padding:4px 8px;
           border-radius:8px;
           text-align:left;
           color:var(--ink);
           font-size:var(--font-sm);
        }
         .notes-more-menu .plain-btn:hover,
        .notes-more-menu .plain-btn.active {
           background:var(--soft);
           text-decoration:none;
        }
         .note-card {
           border:1px solid var(--line);
           border-radius:var(--radius-card);
           background:#fffdf8;
           margin-bottom:8px;
           overflow:hidden;
        }
         .note-card.is-pinned {
           border-color:#ded2a7;
           background:#fffdf6;
        }
         .trash-note-card {
           background:#fffaf7;
           border-color:#ead7d1;
        }
         .trash-note-card .note-tools-row {
           display:flex !important;
        }
         .trash-note-card .icon-btn {
           width:auto;
           min-width:0;
           padding:0 8px;
           font-size:var(--font-sm);
        }
         .notes-sidebar.notes-compact .trash-note-card .note-tools-row {
           display:flex !important;
        }
         .note-title-area {
           padding:8px 9px 3px;
           background:#fbf7f0;
        }
         .note-tools-row {
           display:flex;
           align-items:center;
           justify-content:flex-end;
           gap:4px;
           min-height:30px;
           padding:2px 8px 5px;
           border-bottom:1px solid var(--line);
           background:#fbf7f0;
        }
         .note-card.is-pinned .note-title-area,
        .note-card.is-pinned .note-tools-row {
           background:#fff8df;
        }
         .note-title-input {
           height:25px;
           border:0;
           border-radius:0;
           background:transparent;
           padding:2px 0;
           font-size:12.5px;
           font-weight:600;
           min-width:0;
        }
         .note-title-input:focus {
           background:transparent;
        }
         .compact-expand-btn {
           display:none;
        }
         .note-body {
           min-height:96px;
           height:96px;
           max-height:96px;
           border-left:0;
           resize:none;
           line-height:24px;
           padding:6px 9px;
           background-color:#fffdf8;
           background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 23px, rgba(160, 145, 120, .24) 24px);
           overflow:hidden;
        }
         .trash-note-card .note-body {
           background-color:#fffaf7;
           color:var(--muted);
        }
         .note-body:focus {
           background-color:#fffaf0;
        }
         .notes-sidebar.notes-compact .note-title-area {
           display:grid;
           grid-template-columns:1fr auto;
           align-items:center;
           gap:6px;
           padding:6px 8px;
        }
         .notes-sidebar.notes-compact .compact-expand-btn {
           display:inline-flex;
        }
         .notes-sidebar.notes-compact .note-tools-row,
        .notes-sidebar.notes-compact .note-body,

        function pad(value) {
          return String(value).padStart(2, "0");
        }

        function toKey(date) {
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        }

        function dateStorageKey(key) {
          return `timeblocks:${key}`;
        }

        function fromKey(key) {
          const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
          if (!match) return null;
          const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          return toKey(date) === key ? date : null;
        }

        function mondayFirstIndex(date) {
          return (date.getDay() + 6) % 7;
        }

        function isSameDay(a, b) {
          return a && b && toKey(a) === toKey(b);
        }

        function isWithinRange(date) {
          return date >= START_DATE && date <= END_DATE;
        }

        function getToday() {
          const current = new Date();
          return new Date(current.getFullYear(), current.getMonth(), current.getDate());
        }

        function getInitialDate() {
          const hashDate = fromKey(location.hash.replace("#", ""));
          if (hashDate && isWithinRange(hashDate)) return hashDate;
          const today = getToday();
          return isWithinRange(today) ? today : new Date(START_DATE);
        }

          return date.toLocaleDateString(undefined, { month: "short", year: "numeric" });

          const timeText = `${displayHour}:${pad(minute)}`;
          return timeText;
        }

        function createId() {
          return `note-${Date.now()}-${Math.random().toString(16).slice(2)}`;

        function extractLinks(text) {
          const pattern = /\b((?:https?:\/\/|www\.)[^\s<>()]+[^\s<>().,;:!?])/gi;
          const matches = text.match(pattern) || [];
          return Array.from(new Set(matches));
        }

        function hrefForLink(link) {
          return /^https?:\/\//i.test(link) ? link : `https://${link}`;
        }

        function renderLinks(container, text) {
          const links = extractLinks(text || "");
          container.innerHTML = "";
          container.hidden = links.length === 0;
          if (!links.length) return;

          const title = document.createElement("div");
          title.className = "link-preview-title";
          title.textContent = "Links";

          const list = document.createElement("div");
          list.className = "link-preview-list";

          links.forEach(link => {
            const anchor = document.createElement("a");
            anchor.href = hrefForLink(link);
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.textContent = link;
            anchor.title = link;
            list.appendChild(anchor);
          });

          container.appendChild(title);
          container.appendChild(list);
        }

        function normalizeNotes(rawNotes) {
          if (Array.isArray(rawNotes)) {
            return rawNotes.map(note => ({
              id: note.id || createId(),
              title: note.title || "Untitled",
              body: note.body || "",
              pinned: Boolean(note.pinned),
              deleted: Boolean(note.deleted),
              deletedAt: note.deletedAt || null
            }));
          }
          if (typeof rawNotes === "string" && rawNotes.trim()) {
            return [{
              id: createId(),
              title: "Note",
              body: rawNotes,
              pinned: false,
              deleted: false,
              deletedAt: null
            }];
          }
          return [];
        }

        function orderNotes(noteList) {
          const active = noteList.filter(note => !note.deleted);
          const deleted = noteList.filter(note => note.deleted);
          const pinned = active.filter(note => note.pinned);
          const normal = active.filter(note => !note.pinned);
          return pinned.concat(normal, deleted);
        }

        function noteMatchesSearch(note) {
          const query = notesSearchQuery.trim().toLowerCase();
          if (!query) return true;
          return `${note.title || ""} ${note.body || ""}`.toLowerCase().includes(query);
        }

        function noteMatchesGlobalSearch(note, query) {
          return `${note.title || ""} ${note.body || ""}`.toLowerCase().includes(query);
        }

        function allDateKeys() {
          const keys = [];
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (/^timeblocks:\d{4}-\d{2}-\d{2}$/.test(key || "")) keys.push(key.replace("timeblocks:", ""));
          }
          return keys.sort();
        }

        function globalPreview(text) {
          return (text || "").replace(/\s+/g, " ").trim() || "No note body";
        }

        function searchAllNotes(query) {
          const cleanQuery = query.trim().toLowerCase();
          if (!cleanQuery) return [];
          const results = [];
          allDateKeys().forEach(dateKey => {
            const data = readDateData(dateKey);
            const dateNotes = normalizeNotes(data.notes).filter(note => !note.deleted);
            dateNotes.forEach(note => {
              if (noteMatchesGlobalSearch(note, cleanQuery)) {
                results.push({ dateKey, note });
              }
            });
          });
          return results;
        }

        function readDateData(key) {
          try {

            return {};

        function writeDateData(key, data) {

        function backupFileName() {

        function exportBackup() {
          const data = {};
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (!key || key === COMPACT_KEY || !/^timeblocks:\d{4}-\d{2}-\d{2}$/.test(key)) continue;
            try {
              data[key] = JSON.parse(localStorage.getItem(key));
            } catch (error) {
              data[key] = localStorage.getItem(key);
            }
          }

          const backup = {
            app: "Timeblocks",
            version: "1.0",
            exportedAt: new Date().toISOString(),
            preferences: { notesCompact },
            data
          };

          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "text/plain" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = backupFileName();
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url);
        }

        function isValidBackupData(data) {
          return data && typeof data === "object" && !Array.isArray(data);
        }

        function importBackupText(text) {
          let backup;
          try {
            backup = JSON.parse(text);
          } catch (error) {
            alert("This file is not a valid Timeblocks backup.");
            return;
          }

          if (!backup || backup.app !== "Timeblocks" || !isValidBackupData(backup.data)) {
            alert("This file does not look like a Timeblocks backup.");
            return;
          }

          const entries = Object.entries(backup.data).filter(([key, value]) => {
            return /^timeblocks:\d{4}-\d{2}-\d{2}$/.test(key) && isValidBackupData(value);
          });

          if (!entries.length) {
            alert("No dated Timeblocks data was found in this backup.");
            return;
          }

          const ok = confirm(
            `Import ${entries.length} saved date(s)?\n\n` +
            "Matching dates in this browser will be replaced. Other dates will remain unchanged."
          );
          if (!ok) return;

          entries.forEach(([key, value]) => {
            localStorage.setItem(key, JSON.stringify(value));
          });

          if (backup.preferences && typeof backup.preferences.notesCompact === "boolean") {
            notesCompact = backup.preferences.notesCompact;
            localStorage.setItem(COMPACT_KEY, String(notesCompact));
            applyNotesCompact();
          }

          if (backup.globalTasks && typeof backup.globalTasks === "object") {
            localStorage.setItem(TODO_KEY, JSON.stringify({
              title: backup.globalTasks.title || "Tasks",
              tasks: normalizeGlobalTasks(backup.globalTasks.tasks)
            }));
          }

          buildCalendar();
          loadSelectedDate();
          alert(`Imported ${entries.length} saved date(s).`);
        }

        function hasNotesData(data) {
          if (Array.isArray(data.notes)) {
            return normalizeNotes(data.notes).some(note => !note.deleted && ((note.title || "").trim() || (note.body || "").trim()));
          }

        }

        function hasSavedDataForDate(key) {
          try {
            const data = readDateData(key);

            const hasEvening = Boolean((data.evening || "").trim());
            const hasEntries = data.entries && Object.keys(data.entries).length > 0;
            const hasNotes = hasNotesData(data);

        function autoGrow(box) {
          const minimumHeight = window.matchMedia("(max-width: 759px)").matches ? 34 : 26;
          box.style.height = minimumHeight + "px";
          box.style.height = Math.max(minimumHeight, box.scrollHeight) + "px";
          box.classList.toggle("has-text", box.value.trim().length > 0);

        function clearDropClasses() {
          document.querySelectorAll(".slot.drop-ok, .slot.drop-block").forEach(slot => {
            slot.classList.remove("drop-ok", "drop-block");
          });
        }

        function createSlot(total) {
          const hour = Math.floor(total / 60);
          const minute = total % 60;
          const timeId = `${pad(hour)}:${pad(minute)}`;

          const slot = document.createElement("div");
          slot.className = "slot";
          slot.classList.add(minute === 0 ? "hour-slot" : "half-slot");
          slot.dataset.time = timeId;

          const label = document.createElement("div");
          label.className = "time";
          label.textContent = formatTime(hour, minute);

          const handle = document.createElement("div");
          handle.className = "drag-handle";
          handle.textContent = "⋮⋮";
          handle.title = "Drag entry";
          handle.draggable = true;

          const box = document.createElement("textarea");
          box.dataset.time = timeId;
          box.value = (saved.entries && saved.entries[timeId]) || saved[timeId] || "";
          box.placeholder = "Add...";
          box.setAttribute("aria-label", `Entry for ${label.textContent}`);

          handle.addEventListener("dragstart", event => {
            if (!isDesktopDragEnabled() || !box.value.trim()) {
              event.preventDefault();
              return;
            }
            draggedBox = box;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", box.dataset.time);
          });

          handle.addEventListener("dragend", () => {
            draggedBox = null;
            clearDropClasses();
          });

          slot.addEventListener("dragover", event => {
            if (!isDesktopDragEnabled() || !draggedBox || draggedBox === box) return;
            clearDropClasses();
            if (box.value.trim()) {
              slot.classList.add("drop-block");
              return;
            }
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            slot.classList.add("drop-ok");
          });

          slot.addEventListener("dragleave", () => {
            slot.classList.remove("drop-ok", "drop-block");
          });

          slot.addEventListener("drop", event => {
            if (!isDesktopDragEnabled() || !draggedBox || draggedBox === box || box.value.trim()) {
              clearDropClasses();
              return;
            }
            event.preventDefault();
            box.value = draggedBox.value;
            draggedBox.value = "";
            autoGrow(draggedBox);
            autoGrow(box);
            save();
            clearDropClasses();
          });

          box.addEventListener("input", () => {
            autoGrow(box);
            save();
          });

          box.addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              const boxes = Array.from(document.querySelectorAll("textarea[data-time]"));
              const index = boxes.indexOf(box);
              if (boxes[index + 1]) boxes[index + 1].focus();
            }
          });

          slot.appendChild(label);
          slot.appendChild(handle);
          slot.appendChild(box);
          return slot;
        }

            row.appendChild(createSlot(total + 30));

          document.querySelectorAll("textarea[data-time]").forEach(autoGrow);

            autoGrowNoteBody(body);
            renderLinks(linkPreview, body.value);
            if (expandedNoteId === note.id) {
              expandedBody.value = body.value;
              renderLinks(expandedLinks, body.value);

            save();

          moveButton.addEventListener("click", () => openMoveNote(note.id));
          deleteButton.addEventListener("click", () => deleteNoteById(note.id));

          titleArea.append(title, compactExpandButton);
          toolsRow.append(pinButton, expandButton, moveButton, deleteButton);

        function createTrashCard(note) {

          if (!note) return;

          if (movingNoteId === id) closeMoveNote();
          note.deleted = true;

        function createGlobalTaskId() {
      return `global-task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function normalizeGlobalTasks(rawTasks) {
      if (!Array.isArray(rawTasks)) return [];
      return rawTasks
        .map(task => ({
          id: task.id || createGlobalTaskId(),
          text: String(task.text || "").trim(),
          done: Boolean(task.done)
        }))
        .filter(task => task.text);
    }

    function tasksFromTodoBody(body) {
      return String(body || "")
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const done = /^[☑✓xX]\s+/.test(line) || /^\[[xX]\]\s+/.test(line);
          const text = line
            .replace(/^[☐☑✓xX]\s*/, "")
            .replace(/^\[[ xX]\]\s*/, "")
            .trim();
          return { id: createGlobalTaskId(), text, done };
        })
        .filter(task => task.text);
    }

    function getTodoData() {
      try {
        const data = JSON.parse(localStorage.getItem(TODO_KEY)) || {};
        return {
          title: data.title || "Tasks",
          tasks: Array.isArray(data.tasks) ? normalizeGlobalTasks(data.tasks) : tasksFromTodoBody(data.body)
        };
      } catch (error) {
        return { title: "Tasks", tasks: [] };
      }
    }

    function saveTodoData() {
      localStorage.setItem(TODO_KEY, JSON.stringify({
        title: expandedTitle.value || "Tasks",
        tasks: normalizeGlobalTasks(globalTasks)
      }));
    }

    function createGlobalTaskRow(task) {
      const row = document.createElement("div");
      row.className = "global-task-row";
      row.classList.toggle("task-done", Boolean(task.done));
      row.dataset.id = task.id;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = Boolean(task.done);
      checkbox.title = "Mark task complete";
      checkbox.addEventListener("change", () => {
        task.done = checkbox.checked;
        row.classList.toggle("task-done", Boolean(task.done));
        saveTodoData();
      });

      const text = document.createElement("input");
      text.type = "text";
      text.className = "global-task-text";
      text.value = task.text;
      text.placeholder = "Task";
      text.addEventListener("input", () => {
        task.text = text.value;
        saveTodoData();
      });
      text.addEventListener("blur", () => {
        task.text = text.value.trim();
        if (!task.text) {
          globalTasks = globalTasks.filter(item => item.id !== task.id);
          renderGlobalTasks();
        } else {
          text.value = task.text;
          saveTodoData();
        }
      });
      text.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          globalTaskInput.focus();
        }
      });

      const deleteButton = document.createElement("button");
      deleteButton.className = "plain-btn global-task-delete";
      deleteButton.type = "button";
      deleteButton.textContent = "×";
      deleteButton.title = "Delete task";
      deleteButton.addEventListener("click", () => {
        globalTasks = globalTasks.filter(item => item.id !== task.id);
        renderGlobalTasks();
      });

      row.append(checkbox, text, deleteButton);
      return row;
    }

    function renderGlobalTasks() {
      globalTasksList.innerHTML = "";
      globalTasks = normalizeGlobalTasks(globalTasks);
      globalTasks.forEach(task => globalTasksList.appendChild(createGlobalTaskRow(task)));
      saveTodoData();
    }

    function addGlobalTaskFromInput() {
      const text = globalTaskInput.value.trim();
      if (!text) return;
      globalTasks.push({ id: createGlobalTaskId(), text, done: false });
      globalTaskInput.value = "";
      renderGlobalTasks();
      setTimeout(() => globalTaskInput.focus(), 0);
    }

        function insertMovedNote(targetNotes, note) {
          const activeTarget = targetNotes.filter(item => !item.deleted);
          const deletedTarget = targetNotes.filter(item => item.deleted);
          const updatedActive = activeTarget.slice();
          note.deleted = false;
          note.deletedAt = null;
          if (note.pinned) {
            updatedActive.unshift(note);
          } else {
            const firstNormalIndex = updatedActive.findIndex(item => !item.pinned);
            if (firstNormalIndex === -1) updatedActive.push(note);
            else updatedActive.splice(firstNormalIndex, 0, note);
          }
          return orderNotes(updatedActive).concat(deletedTarget);
        }

        function insertMovedNotes(targetNotes, movedNotes) {
          const activeTarget = targetNotes.filter(note => !note.deleted);
          const deletedTarget = targetNotes.filter(note => note.deleted);
          const cleanMovedNotes = movedNotes.map(note => ({ ...note, deleted: false, deletedAt: null }));
          const movedPinned = cleanMovedNotes.filter(note => note.pinned);
          const movedNormal = cleanMovedNotes.filter(note => !note.pinned);
          const existingPinned = activeTarget.filter(note => note.pinned);
          const existingNormal = activeTarget.filter(note => !note.pinned);
          return movedPinned.concat(existingPinned, movedNormal, existingNormal, deletedTarget);
        }

        function moveAllNotesToDate(targetKey) {
          const sourceKey = toKey(selectedDate);
          const sourceNotes = orderNotes(notes.filter(note => !note.deleted));
          if (!sourceNotes.length) {
            alert("There are no notes to move for this date.");
            return;
          }
          const targetDate = fromKey(targetKey);
          const ok = confirm(
            `Move all ${sourceNotes.length} note(s) from ${displayDate(selectedDate)} to ${displayDate(targetDate)}?\n\n` +
            "Only notes will be moved. Focus, Evening, and Timeblocks will stay on the current date."
          );
          if (!ok) return;

          if (noteModal.classList.contains("open")) closeExpandedEditor();

          const sourceData = currentDateDataFromState();
          sourceData.notes = notes.filter(note => note.deleted);
          writeDateData(sourceKey, sourceData);

          const targetData = readDateData(targetKey);
          const targetNotes = normalizeNotes(targetData.notes);
          targetData.notes = insertMovedNotes(targetNotes, sourceNotes);
          if (!targetData.entries) targetData.entries = {};
          if (!targetData.focus) targetData.focus = "";
          if (!targetData.evening) targetData.evening = "";
          writeDateData(targetKey, targetData);

          notes = sourceData.notes;
          renderNotes();
          markDateHasData(sourceKey);
          markDateHasData(targetKey);
          closeMoveNote();
        }

        function moveSingleNoteToDate(targetKey) {
          if (!movingNoteId) return;
          const sourceKey = toKey(selectedDate);
          if (expandedNoteId === movingNoteId) closeExpandedEditor();

          const sourceIndex = notes.findIndex(note => note.id === movingNoteId && !note.deleted);
          if (sourceIndex === -1) return;
          const [movingNote] = notes.splice(sourceIndex, 1);
          const sourceData = currentDateDataFromState();
          sourceData.notes = orderNotes(notes);
          writeDateData(sourceKey, sourceData);

          const targetData = readDateData(targetKey);
          const targetNotes = normalizeNotes(targetData.notes);
          targetData.notes = insertMovedNote(targetNotes, movingNote);
          if (!targetData.entries) targetData.entries = {};
          if (!targetData.focus) targetData.focus = "";
          if (!targetData.evening) targetData.evening = "";
          writeDateData(targetKey, targetData);

          renderNotes();
          markDateHasData(sourceKey);
          markDateHasData(targetKey);
          closeMoveNote();

        function highlightCurrentTimeBlock() {
          document.querySelectorAll(".slot.current-slot").forEach(slot => {
            slot.classList.remove("current-slot");
          });
          const today = getToday();
          if (!isSameDay(selectedDate, today)) return;
          const current = new Date();
          const currentMinutes = current.getHours() * 60 + current.getMinutes();
          if (currentMinutes < 8 * 60 || currentMinutes > 20 * 60) return;
          const roundedMinutes = Math.floor(currentMinutes / 30) * 30;
          const timeId = `${pad(Math.floor(roundedMinutes / 60))}:${pad(roundedMinutes % 60)}`;
          const currentSlot = document.querySelector(`.slot[data-time="${timeId}"]`);
          if (currentSlot) currentSlot.classList.add("current-slot");
        }

        function addWeekdayHeader(month) {
          const weekdayRow = document.createElement("div");
          weekdayRow.className = "weekday-row";
          WEEKDAYS.forEach(dayName => {
            const dayHeader = document.createElement("div");
            dayHeader.className = "weekday";

          });

        function addBlankDay(days) {
          const spacer = document.createElement("div");
          spacer.className = "day-spacer";

        }

        function buildCalendar() {
          calendarWrap.innerHTML = "";
          const todayKey = toKey(getToday());
          let cursor = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);
          while (cursor <= END_DATE) {
            const month = document.createElement("section");
            month.className = "month";
            const heading = document.createElement("div");
            heading.className = "month-name";
            heading.textContent = monthName(cursor);
            const days = document.createElement("div");
            days.className = "days";
            const monthIndex = cursor.getMonth();
            const year = cursor.getFullYear();
            const firstDay = new Date(year, monthIndex, 1);
            const day = new Date(year, monthIndex, 1);
            for (let index = 0; index < mondayFirstIndex(firstDay); index += 1) addBlankDay(days);
            while (day.getMonth() === monthIndex) {
              if (day >= START_DATE && day <= END_DATE) {
                const key = toKey(day);
                const button = document.createElement("button");
                button.className = "day-btn";
                button.type = "button";
                button.textContent = day.getDate();
                button.dataset.date = key;
                button.title = displayDate(day);
                if (day.getDay() === 0 || day.getDay() === 6) button.classList.add("weekend");
                if (hasSavedDataForDate(key)) button.classList.add("has-data");
                if (key === todayKey) button.classList.add("today");
                if (key === toKey(selectedDate)) button.classList.add("selected");
                button.addEventListener("click", function () {
                  const clickedDate = fromKey(this.dataset.date);
                  if (clickedDate) selectDate(clickedDate, true);
                });
                days.appendChild(button);
              } else {
                addBlankDay(days);
              }
              day.setDate(day.getDate() + 1);
            }
            month.appendChild(heading);
            addWeekdayHeader(month);
            month.appendChild(days);
            calendarWrap.appendChild(month);
            cursor.setMonth(cursor.getMonth() + 1);
          }
        }

            if (globalSearchQuery) clearGlobalSearch();
            if (noteModal.classList.contains("open")) closeExpandedEditor();
            if (moveModal.classList.contains("open")) closeMoveNote();
          }
        });

        clearBtn.addEventListener("click", () => {
          if (!confirm(`Clear all entries for ${displayDate(selectedDate)}?`)) return;
          if (noteModal.classList.contains("open")) closeExpandedEditor();
          if (moveModal.classList.contains("open")) closeMoveNote();
          localStorage.removeItem(storageKey);
          focusInput.value = "";
          eveningInput.value = "";
          autoGrowEvening();
          notes = [];
          renderNotes();
          document.querySelectorAll("textarea[data-time]").forEach(box => {
            box.value = "";
            autoGrow(box);
          });
          markDateHasData(toKey(selectedDate));
          highlightCurrentTimeBlock();
        });

        focusViewBtn.addEventListener("click", toggleFocusView);

        todayBtn.addEventListener("click", () => {
          const today = getToday();
          if (isWithinRange(today)) selectDate(today, true);
        });

        prevDayBtn.addEventListener("click", () => shiftSelectedDate(-1));
        nextDayBtn.addEventListener("click", () => shiftSelectedDate(1));

        exportBackupBtn.addEventListener("click", exportBackup);

        importBackupBtn.addEventListener("click", () => {
          importBackupInput.value = "";
          importBackupInput.click();
        });

        importBackupInput.addEventListener("change", () => {
          const file = importBackupInput.files && importBackupInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => importBackupText(String(reader.result || ""));
          reader.onerror = () => alert("Could not read the selected backup file.");
          reader.readAsText(file);
        });

        sidebarToggle.addEventListener("click", () => {
          const collapsed = !sidebar.classList.contains("collapsed");
          setSidebarCollapsed(sidebar, sidebarToggle, "left-collapsed", collapsed);
          updateFocusViewButton();
        });

        notesToggle.addEventListener("click", () => {
          const collapsed = !notesSidebar.classList.contains("collapsed");
          setSidebarCollapsed(notesSidebar, notesToggle, "right-collapsed", collapsed);
          updateFocusViewButton();
        });

        window.addEventListener("resize", () => {
          document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
          document.querySelectorAll(".note-body").forEach(autoGrowNoteBody);
          autoGrowEvening();
        });

        window.addEventListener("hashchange", () => {
          const hashDate = fromKey(location.hash.replace("#", ""));
          if (hashDate && isWithinRange(hashDate)) selectDate(hashDate, false);
        });

        applyNotesCompact();
        updateSearchUi();
        updateFocusViewButton();
        renderGlobalResults();
        buildCalendar();
        loadSelectedDate();
        history.replaceState(null, "", `#${toKey(selectedDate)}`);
        setInterval(highlightCurrentTimeBlock, 60000);
      })();
  </script>
</body>
</html>
