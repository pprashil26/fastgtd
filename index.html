<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeblocks</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --page: #fffdf8;
      --ink: #3d3a34;
      --muted: #8a8378;
      --line: #e7dfd4;
      --soft: #f1ebe2;
      --entry: #e8f0ec;
      --entry-border: #c8d8d0;
      --focus: #eef1e7;
      --evening: #f3ece7;
      --current: #fff3c7;
      --current-soft: #fff8df;
      --current-ink: #6f5b22;
      --danger: #a56a62;
      --shadow: 0 10px 28px rgba(70, 55, 35, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.25;
      display: flex;
      justify-content: center;
      padding: 10px 8px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .today {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11.5px;
    }

    .hint {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      border: 0;
      background: transparent;
      color: var(--danger);
      font: inherit;
      font-size: 11.5px;
      padding: 1px 0;
      cursor: pointer;
    }

    button:hover {
      text-decoration: underline;
    }

    .note-block {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
    }

    .note-block.bottom {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      background: #fbf7f0;
    }

    .note-line {
      display: grid;
      grid-template-columns: 68px 1fr;
      align-items: center;
      gap: 8px;
    }

    .note-label {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      user-select: none;
    }

    input[type="text"] {
      width: 100%;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      padding: 5px 9px;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      background: #fffdf8;
    }

    input[type="text"]:focus {
      border-color: var(--entry-border);
      background: var(--soft);
    }

    #focusInput {
      background: var(--focus);
    }

    #eveningInput {
      background: var(--evening);
    }

    .timeline {
      padding: 7px 10px 8px;
    }

    .column {
      min-width: 0;
    }

    .slot {
      display: grid;
      grid-template-columns: 58px 1fr;
      min-height: 29px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .slot:last-child {
      border-bottom: 0;
    }

    .slot.current-slot {
      background: var(--current);
      box-shadow: inset 0 0 0 1px rgba(150, 120, 45, 0.16);
    }

    .slot.current-slot .time {
      color: var(--current-ink);
      font-weight: 750;
    }

    .slot.current-slot textarea {
      background: var(--current-soft);
    }

    .time {
      padding: 7px 8px 4px 2px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      text-align: right;
      user-select: none;
    }

    textarea {
      width: 100%;
      min-height: 28px;
      height: 28px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      padding: 6px 8px 5px;
      border-left: 1px solid var(--line);
      overflow: hidden;
    }

    textarea:focus {
      background: var(--soft);
    }

    textarea.has-text {
      background: var(--entry);
      border-left: 3px solid var(--entry-border);
      padding-left: 6px;
    }

    .slot.current-slot textarea.has-text {
      background: linear-gradient(0deg, rgba(232, 240, 236, 0.72), rgba(232, 240, 236, 0.72)), var(--current-soft);
    }

    footer {
      padding: 6px 12px 9px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10.5px;
      text-align: center;
      background: #fbf7f0;
    }

    /* Desktop/tablet landscape: two columns to fit the full day on small laptop screens */
    @media (min-width: 760px) {
      body {
        align-items: flex-start;
        padding: 10px 8px;
      }

      .app {
        max-width: 800px;
      }

      header {
        padding-top: 9px;
        padding-bottom: 7px;
      }

      .timeline {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
        padding: 6px 11px 7px;
      }

      .column:first-child {
        border-right: 1px solid var(--line);
        padding-right: 12px;
      }

      .slot {
        min-height: 27px;
      }

      textarea {
        min-height: 26px;
        height: 26px;
        font-size: 12px;
        padding-top: 5px;
        padding-bottom: 4px;
      }

      .time {
        padding-top: 6px;
        padding-bottom: 3px;
      }

      .note-block {
        padding: 6px 11px;
      }

      input[type="text"] {
        height: 27px;
        font-size: 12.5px;
      }

      footer {
        padding-top: 5px;
        padding-bottom: 7px;
      }
    }

    /* Mobile: one simple vertical column. Inputs use 16px font to prevent iOS/Safari auto zoom. */
    @media (max-width: 759px) {
      body {
        padding: 8px 6px;
      }

      .app {
        max-width: 100%;
        border-radius: 14px;
      }

      .slot {
        grid-template-columns: 52px 1fr;
        min-height: 34px;
      }

      .time {
        font-size: 10.5px;
        padding-top: 9px;
      }

      .note-line {
        grid-template-columns: 56px 1fr;
      }

      input[type="text"],
      textarea {
        font-size: 16px;
      }

      input[type="text"] {
        height: 34px;
        padding: 5px 9px;
      }

      textarea {
        min-height: 34px;
        height: 34px;
        padding: 7px 8px 5px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Timeblocks daily planner">
    <header>
      <div class="title-row">
        <h1>Timeblocks</h1>
        <div class="today" id="todayText">Today</div>
      </div>
      <div class="toolbar">
        <div class="hint">8:00 AM to 8:00 PM · 30 min blocks</div>
        <button id="clearBtn" type="button" title="Clear today's entries">Clear</button>
      </div>
    </header>

    <section class="note-block" aria-label="Focus for the day">
      <div class="note-line">
        <label class="note-label" for="focusInput">Focus</label>
        <input id="focusInput" type="text" placeholder="Focus, critical reminder, intention..." autocomplete="off" />
      </div>
    </section>

    <section class="timeline" id="timeline"></section>

    <section class="note-block bottom" aria-label="Evening reminder">
      <div class="note-line">
        <label class="note-label" for="eveningInput">Evening</label>
        <input id="eveningInput" type="text" placeholder="Evening commitment, reminder..." autocomplete="off" />
      </div>
    </section>

    <footer>
      Current block is highlighted. Saved automatically on this device.
    </footer>
  </main>

  <script>
    (function () {
      const timeline = document.getElementById("timeline");
      const todayText = document.getElementById("todayText");
      const clearBtn = document.getElementById("clearBtn");
      const focusInput = document.getElementById("focusInput");
      const eveningInput = document.getElementById("eveningInput");

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const dateKey = `${yyyy}-${mm}-${dd}`;
      const storageKey = `timeblocks:${dateKey}`;

      todayText.textContent = now.toLocaleDateString(undefined, {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      });

      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch (e) {
        saved = {};
      }

      focusInput.value = saved.focus || "";
      eveningInput.value = saved.evening || "";

      function formatTime(hour, minute) {
        const d = new Date();
        d.setHours(hour, minute, 0, 0);
        return d.toLocaleTimeString(undefined, {
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function save() {
        const data = {
          focus: focusInput.value.trim(),
          evening: eveningInput.value.trim(),
          entries: {}
        };

        document.querySelectorAll("textarea[data-time]").forEach(box => {
          const value = box.value.trim();
          if (value) data.entries[box.dataset.time] = value;
        });

        localStorage.setItem(storageKey, JSON.stringify(data));
      }

      function autoGrow(box) {
        const minHeight = window.matchMedia("(max-width: 759px)").matches ? 34 : 26;
        box.style.height = minHeight + "px";
        box.style.height = Math.max(minHeight, box.scrollHeight) + "px";
        box.classList.toggle("has-text", box.value.trim().length > 0);
      }

      function createSlot(total) {
        const hour = Math.floor(total / 60);
        const minute = total % 60;
        const timeId = `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;

        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.time = timeId;

        const label = document.createElement("div");
        label.className = "time";
        label.textContent = formatTime(hour, minute);

        const box = document.createElement("textarea");
        box.dataset.time = timeId;
        box.value = (saved.entries && saved.entries[timeId]) || saved[timeId] || "";
        box.placeholder = "Add...";
        box.setAttribute("aria-label", `Entry for ${label.textContent}`);

        box.addEventListener("input", function () {
          autoGrow(box);
          save();
        });

        box.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            const boxes = Array.from(document.querySelectorAll("textarea[data-time]"));
            const index = boxes.indexOf(box);
            if (boxes[index + 1]) boxes[index + 1].focus();
          }
        });

        slot.appendChild(label);
        slot.appendChild(box);
        return slot;
      }

      function highlightCurrentTimeBlock() {
        document.querySelectorAll(".slot.current-slot").forEach(slot => {
          slot.classList.remove("current-slot");
        });

        const current = new Date();
        const currentMinutes = current.getHours() * 60 + current.getMinutes();
        const startMinutes = 8 * 60;
        const endMinutes = 20 * 60;

        if (currentMinutes < startMinutes || currentMinutes > endMinutes) {
          return;
        }

        const roundedMinutes = Math.floor(currentMinutes / 30) * 30;
        const hour = Math.floor(roundedMinutes / 60);
        const minute = roundedMinutes % 60;
        const timeId = `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
        const currentSlot = document.querySelector(`.slot[data-time="${timeId}"]`);

        if (currentSlot) {
          currentSlot.classList.add("current-slot");
        }
      }

      function buildTimeline() {
        const firstColumn = document.createElement("div");
        const secondColumn = document.createElement("div");
        firstColumn.className = "column";
        secondColumn.className = "column";

        // 30-minute blocks. Left: 8:00 AM to 1:30 PM. Right: 2:00 PM to 8:00 PM.
        for (let total = 8 * 60; total <= 20 * 60; total += 30) {
          const slot = createSlot(total);
          if (total < 14 * 60) {
            firstColumn.appendChild(slot);
          } else {
            secondColumn.appendChild(slot);
          }
        }

        timeline.appendChild(firstColumn);
        timeline.appendChild(secondColumn);
        document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
        highlightCurrentTimeBlock();
      }

      focusInput.addEventListener("input", save);
      eveningInput.addEventListener("input", save);

      clearBtn.addEventListener("click", function () {
        const ok = confirm("Clear all entries for today?");
        if (!ok) return;
        localStorage.removeItem(storageKey);
        focusInput.value = "";
        eveningInput.value = "";
        document.querySelectorAll("textarea[data-time]").forEach(box => {
          box.value = "";
          autoGrow(box);
        });
        highlightCurrentTimeBlock();
      });

      window.addEventListener("resize", function () {
        document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
      });

      buildTimeline();
      setInterval(highlightCurrentTimeBlock, 60000);
    })();
  </script>
</body>
</html>
