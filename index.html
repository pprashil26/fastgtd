<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeblocks</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --page: #fffdf8;
      --panel: #fbf7f0;
      --ink: #3d3a34;
      --muted: #8a8378;
      --line: #e7dfd4;
      --soft: #f1ebe2;
      --entry: #e8f0ec;
      --entry-border: #c8d8d0;
      --focus: #eef1e7;
      --evening: #f3ece7;
      --current: #fff3c7;
      --current-soft: #fff8df;
      --current-ink: #6f5b22;
      --selected: #dce8e1;
      --today: #f7e7bd;
      --saved-day: #eef5ee;
      --saved-day-border: #d4e3d8;
      --danger: #a56a62;
      --shadow: 0 10px 28px rgba(70, 55, 35, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.25;
      display: flex;
      justify-content: center;
      padding: 10px 8px;
    }

    .shell {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 230px minmax(0, 780px) 230px;
      gap: 10px;
      align-items: start;
      justify-content: center;
    }

    .shell.left-collapsed,
    .shell.right-collapsed,
    .shell.left-collapsed.right-collapsed {
      grid-template-columns: 230px minmax(0, 780px) 230px;
    }

    .sidebar,
    .notes-sidebar,
    .app {
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar,
    .notes-sidebar {
      width: 100%;
      transition: width 0.2s ease;
    }

    .app {
      width: 100%;
      max-width: 780px;
    }

    .sidebar-head,
    .notes-head,
    header {
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
    }

    .sidebar-head,
    .notes-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px 7px;
    }

    .sidebar-title,
    .notes-title {
      font-size: 13px;
      font-weight: 650;
      color: var(--ink);
      white-space: nowrap;
    }

    .plain-btn,
    .icon-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 1px 0;
      cursor: pointer;
    }

    .plain-btn:hover,
    .icon-btn:hover { text-decoration: underline; }

    .icon-btn {
      width: 22px;
      height: 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      text-decoration: none;
    }

    .icon-btn:hover {
      background: var(--soft);
      text-decoration: none;
    }

    .icon-btn.pinned {
      color: #7a6a2a;
      font-weight: 800;
    }

    .icon-btn.delete-note-btn { color: var(--danger); }

    .calendar-wrap {
      max-height: calc(100vh - 80px);
      overflow: auto;
      padding: 8px 8px 10px;
    }

    .month { margin-bottom: 11px; }

    .month-name {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 5px 2px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .weekday-row,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .weekday {
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      text-align: center;
      padding-bottom: 2px;
      user-select: none;
    }

    .day-spacer { min-height: 23px; }

    .day-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      min-height: 23px;
      border-radius: 999px;
      font: inherit;
      font-size: 11px;
      line-height: 1;
      padding: 2px 0;
      text-align: center;
      cursor: pointer;
    }

    .day-btn:hover {
      background: var(--soft);
      text-decoration: none;
    }

    .day-btn.weekend {
      color: var(--muted);
      background: rgba(231, 223, 212, 0.28);
    }

    .day-btn.has-data {
      background: var(--saved-day);
      border-color: var(--saved-day-border);
      color: var(--ink);
      font-weight: 650;
    }

    .day-btn.today {
      border-color: rgba(150, 120, 45, 0.38);
      background: var(--today);
      font-weight: 700;
    }

    .day-btn.selected {
      background: var(--selected);
      border-color: var(--entry-border);
      color: var(--ink);
      font-weight: 800;
    }

    .sidebar.collapsed,
    .notes-sidebar.collapsed { width: 42px; }

    .sidebar.collapsed .sidebar-head,
    .notes-sidebar.collapsed .notes-head {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .calendar-wrap,
    .notes-sidebar.collapsed .notes-title,
    .notes-sidebar.collapsed .notes-wrap { display: none; }

    header { padding: 9px 12px 7px; }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .selected-date {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11.5px;
    }

    .hint {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      white-space: nowrap;
    }

    .clear-btn { color: var(--danger); }

    .note-block {
      padding: 6px 11px;
      border-bottom: 1px solid var(--line);
    }

    .note-block.bottom {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      background: var(--panel);
    }

    .note-line {
      display: grid;
      grid-template-columns: 68px 1fr;
      align-items: center;
      gap: 8px;
    }

    .note-label {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      user-select: none;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      height: 27px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      padding: 5px 9px;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      background: #fffdf8;
    }

    input[type="text"]:focus,
    input[type="date"]:focus {
      border-color: var(--entry-border);
      background: var(--soft);
    }

    #focusInput { background: var(--focus); }
    #eveningInput { background: var(--evening); }

    .timeline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
      padding: 6px 11px 7px;
    }

    .column { min-width: 0; }

    .column:first-child {
      border-right: 1px solid var(--line);
      padding-right: 12px;
    }

    .slot {
      display: grid;
      grid-template-columns: 58px 18px 1fr;
      min-height: 27px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .slot:last-child { border-bottom: 0; }

    .slot.current-slot {
      background: var(--current);
      box-shadow: inset 0 0 0 1px rgba(150, 120, 45, 0.16);
    }

    .slot.current-slot .time {
      color: var(--current-ink);
      font-weight: 750;
    }

    .slot.current-slot textarea { background: var(--current-soft); }

    .slot.drop-ok {
      background: #e9f4ea;
      box-shadow: inset 0 0 0 1px #bdd5c2;
    }

    .slot.drop-block {
      background: #f7ebe8;
      box-shadow: inset 0 0 0 1px #e2beb7;
    }

    .time {
      padding: 6px 8px 3px 2px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      text-align: right;
      user-select: none;
    }

    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      cursor: grab;
      user-select: none;
      opacity: 0.72;
    }

    .drag-handle:active { cursor: grabbing; }

    textarea {
      width: 100%;
      min-height: 26px;
      height: 26px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      padding: 5px 8px 4px;
      border-left: 1px solid var(--line);
      overflow: hidden;
    }

    textarea:focus { background: var(--soft); }

    textarea.has-text {
      background: var(--entry);
      border-left: 3px solid var(--entry-border);
      padding-left: 6px;
    }

    .slot.current-slot textarea.has-text {
      background: linear-gradient(0deg, rgba(232, 240, 236, 0.72), rgba(232, 240, 236, 0.72)), var(--current-soft);
    }

    footer {
      padding: 5px 12px 7px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10.5px;
      text-align: center;
      background: var(--panel);
    }

    .notes-wrap { padding: 8px; }

    .notes-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .notes-hint {
      color: var(--muted);
      font-size: 10.5px;
      margin: 0;
    }

    .note-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffdf8;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .note-card.is-pinned {
      border-color: #ded2a7;
      background: #fffdf6;
    }

    .note-title-area {
      padding: 7px 8px 3px;
      border-bottom: 0;
      background: #fbf7f0;
    }

    .note-tools-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      padding: 2px 8px 5px;
      border-bottom: 1px solid var(--line);
      background: #fbf7f0;
    }

    .note-card.is-pinned .note-title-area,
    .note-card.is-pinned .note-tools-row { background: #fff8df; }

    .note-title-input {
      height: 25px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 2px 0;
      font-size: 12.5px;
      font-weight: 650;
      min-width: 0;
    }

    .note-title-input:focus { background: transparent; }

    .note-body {
      min-height: 96px;
      height: 96px;
      max-height: 96px;
      border-left: 0;
      resize: none;
      line-height: 24px;
      padding: 6px 9px;
      background-color: #fffdf8;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 23px,
        rgba(160, 145, 120, 0.24) 24px
      );
      overflow: hidden;
    }

    .note-body:focus { background-color: #fffaf0; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(61, 58, 52, 0.28);
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .expanded-note,
    .move-note-panel {
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(50, 40, 28, 0.22);
      overflow: hidden;
    }

    .expanded-note {
      width: min(420px, 92vw);
      min-height: min(600px, 82vh);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }

    .expanded-note-head,
    .move-note-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
    }

    .expanded-title {
      height: 30px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 3px 0;
      font-size: 15px;
      font-weight: 700;
    }

    .expanded-title:focus { background: transparent; }

    .expanded-body {
      flex: 1;
      min-height: 460px;
      height: auto;
      resize: none;
      border: 0;
      border-left: 0;
      border-radius: 0;
      line-height: 26px;
      font-size: 14px;
      padding: 10px 14px;
      background-color: #fffdf8;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 25px,
        rgba(160, 145, 120, 0.24) 26px
      );
      overflow: auto;
    }

    .expanded-body:focus { background-color: #fffaf0; }

    .move-note-panel {
      width: min(340px, 92vw);
    }

    .move-note-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .move-note-body {
      padding: 12px;
    }

    .move-note-body label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .move-note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 12px 12px;
    }

    @media (max-width: 1080px) and (min-width: 760px) {
      .shell,
      .shell.left-collapsed,
      .shell.right-collapsed,
      .shell.left-collapsed.right-collapsed {
        grid-template-columns: 210px minmax(0, 1fr) 210px;
      }

      .weekday { font-size: 9px; }
    }

    @media (max-width: 759px) {
      body { padding: 8px 6px; }

      .shell,
      .shell.left-collapsed,
      .shell.right-collapsed,
      .shell.left-collapsed.right-collapsed {
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }

      .sidebar,
      .notes-sidebar {
        width: 100%;
        border-radius: 14px;
      }

      .sidebar {
        order: 1;
        margin-bottom: 8px;
      }

      .notes-sidebar {
        order: 2;
        margin-bottom: 8px;
      }

      .app {
        order: 3;
        max-width: 100%;
        border-radius: 14px;
      }

      .sidebar.collapsed,
      .notes-sidebar.collapsed { width: 100%; }

      .sidebar.collapsed .sidebar-title,
      .notes-sidebar.collapsed .notes-title { display: block; }

      .sidebar.collapsed .calendar-wrap,
      .notes-sidebar.collapsed .notes-wrap { display: none; }

      .sidebar-head,
      .notes-head { padding: 8px 10px; }

      .calendar-wrap { max-height: 45vh; }

      .title-row { gap: 8px; }
      h1 { font-size: 17px; }
      .selected-date { font-size: 11.5px; }
      .toolbar { font-size: 11px; }
      .note-line { grid-template-columns: 56px 1fr; }

      .timeline {
        display: block;
        padding: 7px 10px 8px;
      }

      .column:first-child {
        border-right: 0;
        padding-right: 0;
      }

      .slot {
        grid-template-columns: 52px 1fr;
        min-height: 34px;
      }

      .drag-handle { display: none; }

      .time {
        font-size: 10.5px;
        padding-top: 9px;
      }

      input[type="text"],
      input[type="date"],
      textarea { font-size: 16px; }

      input[type="text"],
      input[type="date"] {
        height: 34px;
        padding: 5px 9px;
      }

      textarea {
        min-height: 34px;
        height: 34px;
        padding: 7px 8px 5px;
      }

      .note-title-input {
        height: 32px;
        font-size: 16px;
      }

      .note-body {
        min-height: 104px;
        height: 104px;
        max-height: 104px;
        line-height: 26px;
        resize: none;
        overflow: hidden;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 25px,
          rgba(160, 145, 120, 0.24) 26px
        );
      }

      .modal-backdrop { padding: 10px; }

      .expanded-note {
        width: 100%;
        min-height: 78vh;
        max-height: 90vh;
        border-radius: 16px;
      }

      .expanded-title {
        height: 34px;
        font-size: 16px;
      }

      .expanded-body {
        min-height: 58vh;
        font-size: 16px;
        line-height: 28px;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          rgba(160, 145, 120, 0.24) 28px
        );
      }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Compact calendar sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">Calendar</div>
        <button class="plain-btn" id="sidebarToggle" type="button" aria-expanded="true" title="Show or hide calendar">Hide</button>
      </div>
      <div class="calendar-wrap" id="calendarWrap"></div>
    </aside>

    <main class="app" aria-label="Timeblocks daily planner">
      <header>
        <div class="title-row">
          <h1>Timeblocks</h1>
          <div class="selected-date" id="selectedDateText">Selected date</div>
        </div>
        <div class="toolbar">
          <div class="hint">8:00 AM to 8:00 PM · 30 min blocks</div>
          <div class="actions">
            <button class="plain-btn" id="todayBtn" type="button" title="Open today">Today</button>
            <button class="plain-btn clear-btn" id="clearBtn" type="button" title="Clear selected day's entries">Clear</button>
          </div>
        </div>
      </header>

      <section class="note-block" aria-label="Focus for the day">
        <div class="note-line">
          <label class="note-label" for="focusInput">Focus</label>
          <input id="focusInput" type="text" placeholder="Focus, critical reminder, intention..." autocomplete="off" />
        </div>
      </section>

      <section class="timeline" id="timeline"></section>

      <section class="note-block bottom" aria-label="Evening reminder">
        <div class="note-line">
          <label class="note-label" for="eveningInput">Evening</label>
          <input id="eveningInput" type="text" placeholder="Evening commitment, reminder..." autocomplete="off" />
        </div>
      </section>

      <footer>
        Select a date from the calendar. Current block highlights only for today. Saved automatically on this device.
      </footer>
    </main>

    <aside class="notes-sidebar" id="notesSidebar" aria-label="Lined notepad sidebar">
      <div class="notes-head">
        <div class="notes-title">Notepad</div>
        <button class="plain-btn" id="notesToggle" type="button" aria-expanded="true" title="Show or hide notepad">Hide</button>
      </div>
      <div class="notes-wrap">
        <div class="notes-top">
          <p class="notes-hint">Multiple notes. Saved with selected date.</p>
          <button class="plain-btn" id="addNoteBtn" type="button" title="Add note">+ Note</button>
        </div>
        <div id="notesList"></div>
      </div>
    </aside>
  </div>

  <div class="modal-backdrop" id="noteModal" aria-hidden="true">
    <section class="expanded-note" role="dialog" aria-modal="true" aria-label="Expanded note editor">
      <div class="expanded-note-head">
        <input id="expandedTitle" class="expanded-title" type="text" placeholder="Note title" autocomplete="off" />
        <button class="plain-btn" id="closeExpandedNote" type="button" title="Close expanded note">Close</button>
      </div>
      <textarea id="expandedBody" class="expanded-body" placeholder="Write note..."></textarea>
    </section>
  </div>

  <div class="modal-backdrop" id="moveModal" aria-hidden="true">
    <section class="move-note-panel" role="dialog" aria-modal="true" aria-label="Move note to another day">
      <div class="move-note-head">
        <p class="move-note-title">Move Note</p>
        <button class="plain-btn" id="cancelMoveTop" type="button" title="Cancel move">Close</button>
      </div>
      <div class="move-note-body">
        <label for="moveDateInput">Move to date</label>
        <input id="moveDateInput" type="date" />
      </div>
      <div class="move-note-actions">
        <button class="plain-btn" id="cancelMoveBtn" type="button">Cancel</button>
        <button class="plain-btn" id="confirmMoveBtn" type="button">Move</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const START_DATE = new Date(2026, 6, 1);
      const END_DATE = new Date(2027, 11, 31);
      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const shell = document.getElementById("shell");
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebarToggle");
      const notesSidebar = document.getElementById("notesSidebar");
      const notesToggle = document.getElementById("notesToggle");
      const calendarWrap = document.getElementById("calendarWrap");
      const timeline = document.getElementById("timeline");
      const selectedDateText = document.getElementById("selectedDateText");
      const clearBtn = document.getElementById("clearBtn");
      const todayBtn = document.getElementById("todayBtn");
      const focusInput = document.getElementById("focusInput");
      const eveningInput = document.getElementById("eveningInput");
      const addNoteBtn = document.getElementById("addNoteBtn");
      const notesList = document.getElementById("notesList");
      const noteModal = document.getElementById("noteModal");
      const expandedTitle = document.getElementById("expandedTitle");
      const expandedBody = document.getElementById("expandedBody");
      const closeExpandedNote = document.getElementById("closeExpandedNote");
      const moveModal = document.getElementById("moveModal");
      const moveDateInput = document.getElementById("moveDateInput");
      const cancelMoveTop = document.getElementById("cancelMoveTop");
      const cancelMoveBtn = document.getElementById("cancelMoveBtn");
      const confirmMoveBtn = document.getElementById("confirmMoveBtn");

      let selectedDate = getInitialDate();
      let storageKey = "";
      let saved = {};
      let notes = [];
      let draggedBox = null;
      let expandedNoteId = null;
      let movingNoteId = null;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function toKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function fromKey(key) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
        if (!match) return null;
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        if (toKey(date) !== key) return null;
        return date;
      }

      function mondayFirstIndex(date) {
        return (date.getDay() + 6) % 7;
      }

      function isSameDay(a, b) {
        return a && b && toKey(a) === toKey(b);
      }

      function isWithinRange(date) {
        return date >= START_DATE && date <= END_DATE;
      }

      function getToday() {
        const current = new Date();
        return new Date(current.getFullYear(), current.getMonth(), current.getDate());
      }

      function getInitialDate() {
        const hashDate = fromKey(location.hash.replace("#", ""));
        if (hashDate && isWithinRange(hashDate)) return hashDate;

        const today = getToday();
        if (isWithinRange(today)) return today;

        return new Date(START_DATE);
      }

      function isDesktopDragEnabled() {
        return window.matchMedia("(min-width: 760px)").matches;
      }

      function selectedStorageKey() {
        return `timeblocks:${toKey(selectedDate)}`;
      }

      function dateStorageKey(dateKey) {
        return `timeblocks:${dateKey}`;
      }

      function displayDate(date) {
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric"
        });
      }

      function monthName(date) {
        return date.toLocaleDateString(undefined, { month: "short", year: "numeric" });
      }

      function formatTime(hour, minute) {
        const displayHour = hour % 12 || 12;
        const timeText = `${displayHour}:${pad(minute)}`;

        if (hour === 8 && minute === 0) return `${timeText} AM`;
        if (hour === 12 && minute === 0) return `${timeText} PM`;

        return timeText;
      }

      function createId() {
        return `note-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normalizeNotes(rawNotes) {
        if (Array.isArray(rawNotes)) {
          return rawNotes.map(note => ({
            id: note.id || createId(),
            title: note.title || "Untitled",
            body: note.body || "",
            pinned: Boolean(note.pinned)
          }));
        }

        if (typeof rawNotes === "string" && rawNotes.trim()) {
          return [{
            id: createId(),
            title: "Note",
            body: rawNotes,
            pinned: false
          }];
        }

        return [];
      }

      function orderNotes(noteList) {
        const pinned = noteList.filter(note => note.pinned);
        const normal = noteList.filter(note => !note.pinned);
        return pinned.concat(normal);
      }

      function readDateData(dateKey) {
        try {
          return JSON.parse(localStorage.getItem(dateStorageKey(dateKey))) || {};
        } catch (error) {
          return {};
        }
      }

      function writeDateData(dateKey, data) {
        localStorage.setItem(dateStorageKey(dateKey), JSON.stringify(data));
      }

      function readSavedData() {
        storageKey = selectedStorageKey();
        saved = readDateData(toKey(selectedDate));
        notes = orderNotes(normalizeNotes(saved.notes));
      }

      function hasNotesData(data) {
        if (Array.isArray(data.notes)) {
          return data.notes.some(note => (note.title || "").trim() || (note.body || "").trim());
        }
        return Boolean((data.notes || "").trim());
      }

      function hasSavedDataForDate(key) {
        try {
          const data = readDateData(key);
          const hasFocus = Boolean((data.focus || "").trim());
          const hasEvening = Boolean((data.evening || "").trim());
          const hasEntries = data.entries && Object.keys(data.entries).length > 0;
          const hasNotes = hasNotesData(data);
          return hasFocus || hasEvening || hasEntries || hasNotes;
        } catch (error) {
          return false;
        }
      }

      function collectNotes() {
        return Array.from(document.querySelectorAll(".note-card")).map(card => ({
          id: card.dataset.id,
          title: card.querySelector(".note-title-input").value,
          body: card.querySelector(".note-body").value,
          pinned: card.dataset.pinned === "true"
        }));
      }

      function collectEntries() {
        const entries = {};
        document.querySelectorAll("textarea[data-time]").forEach(box => {
          if (box.value.trim()) entries[box.dataset.time] = box.value;
        });
        return entries;
      }

      function currentDateDataFromDom() {
        return {
          focus: focusInput.value,
          evening: eveningInput.value,
          notes: collectNotes(),
          entries: collectEntries()
        };
      }

      function save() {
        const data = currentDateDataFromDom();
        notes = data.notes;
        writeDateData(toKey(selectedDate), data);
        markDateHasData(toKey(selectedDate));
      }

      function markDateHasData(key) {
        const button = document.querySelector(`.day-btn[data-date="${key}"]`);
        if (!button) return;
        button.classList.toggle("has-data", hasSavedDataForDate(key));
      }

      function autoGrow(box) {
        const minimumHeight = window.matchMedia("(max-width: 759px)").matches ? 34 : 26;
        box.style.height = minimumHeight + "px";
        box.style.height = Math.max(minimumHeight, box.scrollHeight) + "px";
        box.classList.toggle("has-text", box.value.trim().length > 0);
      }

      function autoGrowNoteBody(box) {
        const fixedHeight = window.matchMedia("(max-width: 759px)").matches ? 104 : 96;
        box.style.height = fixedHeight + "px";
      }

      function clearDropClasses() {
        document.querySelectorAll(".slot.drop-ok, .slot.drop-block").forEach(slot => {
          slot.classList.remove("drop-ok", "drop-block");
        });
      }

      function createSlot(total) {
        const hour = Math.floor(total / 60);
        const minute = total % 60;
        const timeId = `${pad(hour)}:${pad(minute)}`;

        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.time = timeId;

        const label = document.createElement("div");
        label.className = "time";
        label.textContent = formatTime(hour, minute);

        const handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.textContent = "⋮⋮";
        handle.title = "Drag entry";
        handle.draggable = true;

        const box = document.createElement("textarea");
        box.dataset.time = timeId;
        box.value = (saved.entries && saved.entries[timeId]) || saved[timeId] || "";
        box.placeholder = "Add...";
        box.setAttribute("aria-label", `Entry for ${label.textContent}`);

        handle.addEventListener("dragstart", event => {
          if (!isDesktopDragEnabled() || !box.value.trim()) {
            event.preventDefault();
            return;
          }
          draggedBox = box;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", box.dataset.time);
        });

        handle.addEventListener("dragend", () => {
          draggedBox = null;
          clearDropClasses();
        });

        slot.addEventListener("dragover", event => {
          if (!isDesktopDragEnabled() || !draggedBox || draggedBox === box) return;

          clearDropClasses();
          if (box.value.trim()) {
            slot.classList.add("drop-block");
            return;
          }

          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          slot.classList.add("drop-ok");
        });

        slot.addEventListener("dragleave", () => {
          slot.classList.remove("drop-ok", "drop-block");
        });

        slot.addEventListener("drop", event => {
          if (!isDesktopDragEnabled() || !draggedBox || draggedBox === box || box.value.trim()) {
            clearDropClasses();
            return;
          }

          event.preventDefault();
          box.value = draggedBox.value;
          draggedBox.value = "";
          autoGrow(draggedBox);
          autoGrow(box);
          save();
          clearDropClasses();
        });

        box.addEventListener("input", () => {
          autoGrow(box);
          save();
        });

        box.addEventListener("keydown", event => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            const boxes = Array.from(document.querySelectorAll("textarea[data-time]"));
            const index = boxes.indexOf(box);
            if (boxes[index + 1]) boxes[index + 1].focus();
          }
        });

        slot.appendChild(label);
        slot.appendChild(handle);
        slot.appendChild(box);
        return slot;
      }

      function buildTimeline() {
        timeline.innerHTML = "";
        const firstColumn = document.createElement("div");
        const secondColumn = document.createElement("div");
        firstColumn.className = "column";
        secondColumn.className = "column";

        for (let total = 8 * 60; total <= 20 * 60; total += 30) {
          const slot = createSlot(total);
          if (total < 14 * 60) {
            firstColumn.appendChild(slot);
          } else {
            secondColumn.appendChild(slot);
          }
        }

        timeline.appendChild(firstColumn);
        timeline.appendChild(secondColumn);
        document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
      }

      function createNoteCard(note) {
        const card = document.createElement("section");
        card.className = "note-card";
        card.dataset.id = note.id || createId();
        card.dataset.pinned = String(Boolean(note.pinned));
        card.classList.toggle("is-pinned", Boolean(note.pinned));

        const titleArea = document.createElement("div");
        titleArea.className = "note-title-area";

        const title = document.createElement("input");
        title.className = "note-title-input";
        title.type = "text";
        title.value = note.title || "Untitled";
        title.placeholder = "Note title";
        title.title = note.pinned ? "Pinned note" : "Note title";

        const toolsRow = document.createElement("div");
        toolsRow.className = "note-tools-row";

        const pinButton = document.createElement("button");
        pinButton.className = "icon-btn pin-note-btn";
        pinButton.type = "button";
        pinButton.textContent = note.pinned ? "★" : "☆";
        pinButton.title = note.pinned ? "Unpin note" : "Pin note";
        pinButton.classList.toggle("pinned", Boolean(note.pinned));

        const expandButton = document.createElement("button");
        expandButton.className = "icon-btn";
        expandButton.type = "button";
        expandButton.textContent = "⤢";
        expandButton.title = "Open larger note editor";

        const moveButton = document.createElement("button");
        moveButton.className = "icon-btn";
        moveButton.type = "button";
        moveButton.textContent = "⇄";
        moveButton.title = "Move note to another day";

        const deleteButton = document.createElement("button");
        deleteButton.className = "icon-btn delete-note-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.title = "Delete note";

        const body = document.createElement("textarea");
        body.className = "note-body";
        body.value = note.body || "";
        body.placeholder = "Write note...";

        title.addEventListener("input", () => {
          if (expandedNoteId === card.dataset.id) expandedTitle.value = title.value;
          save();
        });

        body.addEventListener("input", () => {
          autoGrowNoteBody(body);
          if (expandedNoteId === card.dataset.id) expandedBody.value = body.value;
          save();
        });

        pinButton.addEventListener("click", () => togglePin(card.dataset.id));
        expandButton.addEventListener("click", () => openExpandedNote(card.dataset.id));
        moveButton.addEventListener("click", () => openMoveNote(card.dataset.id));

        deleteButton.addEventListener("click", () => {
          if (!confirm("Delete this note?")) return;
          if (expandedNoteId === card.dataset.id) closeExpandedEditor();
          if (movingNoteId === card.dataset.id) closeMoveNote();
          card.remove();
          notes = orderNotes(collectNotes());
          renderNotes();
          save();
        });

        titleArea.appendChild(title);
        toolsRow.appendChild(pinButton);
        toolsRow.appendChild(expandButton);
        toolsRow.appendChild(moveButton);
        toolsRow.appendChild(deleteButton);
        card.appendChild(titleArea);
        card.appendChild(toolsRow);
        card.appendChild(body);
        return card;
      }

      function getNoteCardById(id) {
        return document.querySelector(`.note-card[data-id="${id}"]`);
      }

      function togglePin(id) {
        const currentNotes = collectNotes();
        const index = currentNotes.findIndex(note => note.id === id);
        if (index === -1) return;

        const [note] = currentNotes.splice(index, 1);
        note.pinned = !note.pinned;

        if (note.pinned) {
          const firstNormalIndex = currentNotes.findIndex(item => !item.pinned);
          if (firstNormalIndex === -1) currentNotes.push(note);
          else currentNotes.splice(firstNormalIndex, 0, note);
        } else {
          const firstNormalIndex = currentNotes.findIndex(item => !item.pinned);
          if (firstNormalIndex === -1) currentNotes.push(note);
          else currentNotes.splice(firstNormalIndex, 0, note);
        }

        notes = orderNotes(currentNotes);
        renderNotes();
        save();
      }

      function openExpandedNote(id) {
        const card = getNoteCardById(id);
        if (!card) return;

        expandedNoteId = id;
        expandedTitle.value = card.querySelector(".note-title-input").value;
        expandedBody.value = card.querySelector(".note-body").value;
        noteModal.classList.add("open");
        noteModal.setAttribute("aria-hidden", "false");
        setTimeout(() => expandedBody.focus(), 0);
      }

      function syncExpandedToCard() {
        if (!expandedNoteId) return;
        const card = getNoteCardById(expandedNoteId);
        if (!card) return;

        const title = card.querySelector(".note-title-input");
        const body = card.querySelector(".note-body");
        title.value = expandedTitle.value;
        body.value = expandedBody.value;
        autoGrowNoteBody(body);
        save();
      }

      function closeExpandedEditor() {
        noteModal.classList.remove("open");
        noteModal.setAttribute("aria-hidden", "true");
        expandedNoteId = null;
      }

      function openMoveNote(id) {
        const card = getNoteCardById(id);
        if (!card) return;

        movingNoteId = id;
        moveDateInput.min = toKey(START_DATE);
        moveDateInput.max = toKey(END_DATE);
        moveDateInput.value = toKey(selectedDate);
        moveModal.classList.add("open");
        moveModal.setAttribute("aria-hidden", "false");
        setTimeout(() => moveDateInput.focus(), 0);
      }

      function closeMoveNote() {
        moveModal.classList.remove("open");
        moveModal.setAttribute("aria-hidden", "true");
        movingNoteId = null;
      }

      function insertMovedNote(targetNotes, note) {
        if (note.pinned) {
          targetNotes.unshift(note);
          return orderNotes(targetNotes);
        }

        const firstNormalIndex = targetNotes.findIndex(item => !item.pinned);
        if (firstNormalIndex === -1) targetNotes.push(note);
        else targetNotes.splice(firstNormalIndex, 0, note);
        return orderNotes(targetNotes);
      }

      function moveNoteToDate() {
        if (!movingNoteId) return;

        const targetKey = moveDateInput.value;
        const targetDate = fromKey(targetKey);
        if (!targetDate || !isWithinRange(targetDate)) {
          alert("Please select a date between 1 July 2026 and 31 December 2027.");
          return;
        }

        const sourceKey = toKey(selectedDate);
        if (targetKey === sourceKey) {
          alert("Please select a different date.");
          return;
        }

        if (expandedNoteId === movingNoteId) closeExpandedEditor();

        const currentNotes = collectNotes();
        const sourceIndex = currentNotes.findIndex(note => note.id === movingNoteId);
        if (sourceIndex === -1) return;

        const [movingNote] = currentNotes.splice(sourceIndex, 1);
        const sourceData = currentDateDataFromDom();
        sourceData.notes = orderNotes(currentNotes);
        writeDateData(sourceKey, sourceData);

        const targetData = readDateData(targetKey);
        const targetNotes = normalizeNotes(targetData.notes);
        targetData.notes = insertMovedNote(targetNotes, movingNote);
        if (!targetData.entries) targetData.entries = {};
        if (!targetData.focus) targetData.focus = "";
        if (!targetData.evening) targetData.evening = "";
        writeDateData(targetKey, targetData);

        notes = sourceData.notes;
        renderNotes();
        markDateHasData(sourceKey);
        markDateHasData(targetKey);
        closeMoveNote();
      }

      function renderNotes() {
        notesList.innerHTML = "";
        notes = orderNotes(notes);
        notes.forEach(note => notesList.appendChild(createNoteCard(note)));
        document.querySelectorAll(".note-body").forEach(autoGrowNoteBody);
      }

      function highlightCurrentTimeBlock() {
        document.querySelectorAll(".slot.current-slot").forEach(slot => {
          slot.classList.remove("current-slot");
        });

        const today = getToday();
        if (!isSameDay(selectedDate, today)) return;

        const current = new Date();
        const currentMinutes = current.getHours() * 60 + current.getMinutes();
        const startMinutes = 8 * 60;
        const endMinutes = 20 * 60;

        if (currentMinutes < startMinutes || currentMinutes > endMinutes) return;

        const roundedMinutes = Math.floor(currentMinutes / 30) * 30;
        const timeId = `${pad(Math.floor(roundedMinutes / 60))}:${pad(roundedMinutes % 60)}`;
        const currentSlot = document.querySelector(`.slot[data-time="${timeId}"]`);
        if (currentSlot) currentSlot.classList.add("current-slot");
      }

      function loadSelectedDate() {
        readSavedData();
        selectedDateText.textContent = displayDate(selectedDate);
        focusInput.value = saved.focus || "";
        eveningInput.value = saved.evening || "";
        buildTimeline();
        renderNotes();
        updateSelectedCalendarDay();
        highlightCurrentTimeBlock();
      }

      function selectDate(date, updateHash) {
        if (!isWithinRange(date)) return;
        if (noteModal.classList.contains("open")) closeExpandedEditor();
        if (moveModal.classList.contains("open")) closeMoveNote();

        selectedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        if (updateHash) history.replaceState(null, "", `#${toKey(selectedDate)}`);
        loadSelectedDate();
      }

      function updateSelectedCalendarDay() {
        const selectedKey = toKey(selectedDate);
        document.querySelectorAll(".day-btn.selected").forEach(button => {
          button.classList.remove("selected");
        });

        const button = document.querySelector(`.day-btn[data-date="${selectedKey}"]`);
        if (button) {
          button.classList.add("selected");
          button.scrollIntoView({ block: "nearest" });
        }
      }

      function addWeekdayHeader(month) {
        const weekdayRow = document.createElement("div");
        weekdayRow.className = "weekday-row";
        WEEKDAYS.forEach(dayName => {
          const dayHeader = document.createElement("div");
          dayHeader.className = "weekday";
          dayHeader.textContent = dayName;
          weekdayRow.appendChild(dayHeader);
        });
        month.appendChild(weekdayRow);
      }

      function addBlankDay(days) {
        const spacer = document.createElement("div");
        spacer.className = "day-spacer";
        spacer.setAttribute("aria-hidden", "true");
        days.appendChild(spacer);
      }

      function buildCalendar() {
        calendarWrap.innerHTML = "";
        const todayKey = toKey(getToday());
        let cursor = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);

        while (cursor <= END_DATE) {
          const month = document.createElement("section");
          month.className = "month";

          const heading = document.createElement("div");
          heading.className = "month-name";
          heading.textContent = monthName(cursor);

          const days = document.createElement("div");
          days.className = "days";

          const monthIndex = cursor.getMonth();
          const year = cursor.getFullYear();
          const firstDayOfMonth = new Date(year, monthIndex, 1);
          const day = new Date(year, monthIndex, 1);

          for (let index = 0; index < mondayFirstIndex(firstDayOfMonth); index += 1) {
            addBlankDay(days);
          }

          while (day.getMonth() === monthIndex) {
            if (day >= START_DATE && day <= END_DATE) {
              const key = toKey(day);
              const button = document.createElement("button");
              button.className = "day-btn";
              button.type = "button";
              button.textContent = day.getDate();
              button.dataset.date = key;
              button.title = displayDate(day);

              if (day.getDay() === 0 || day.getDay() === 6) button.classList.add("weekend");
              if (hasSavedDataForDate(key)) button.classList.add("has-data");
              if (key === todayKey) button.classList.add("today");
              if (key === toKey(selectedDate)) button.classList.add("selected");

              button.addEventListener("click", function () {
                const clickedDate = fromKey(this.dataset.date);
                if (clickedDate) selectDate(clickedDate, true);
              });

              days.appendChild(button);
            } else {
              addBlankDay(days);
            }
            day.setDate(day.getDate() + 1);
          }

          month.appendChild(heading);
          addWeekdayHeader(month);
          month.appendChild(days);
          calendarWrap.appendChild(month);
          cursor.setMonth(cursor.getMonth() + 1);
        }
      }

      focusInput.addEventListener("input", save);
      eveningInput.addEventListener("input", save);

      addNoteBtn.addEventListener("click", () => {
        const newNote = {
          id: createId(),
          title: "New Note",
          body: "",
          pinned: false
        };

        notes.unshift(newNote);
        renderNotes();
        save();
        openExpandedNote(newNote.id);
        expandedTitle.focus();
        expandedTitle.select();
      });

      expandedTitle.addEventListener("input", syncExpandedToCard);
      expandedBody.addEventListener("input", syncExpandedToCard);
      closeExpandedNote.addEventListener("click", closeExpandedEditor);

      noteModal.addEventListener("click", event => {
        if (event.target === noteModal) closeExpandedEditor();
      });

      cancelMoveTop.addEventListener("click", closeMoveNote);
      cancelMoveBtn.addEventListener("click", closeMoveNote);
      confirmMoveBtn.addEventListener("click", moveNoteToDate);

      moveModal.addEventListener("click", event => {
        if (event.target === moveModal) closeMoveNote();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (noteModal.classList.contains("open")) closeExpandedEditor();
          if (moveModal.classList.contains("open")) closeMoveNote();
        }
      });

      clearBtn.addEventListener("click", () => {
        if (!confirm(`Clear all entries for ${displayDate(selectedDate)}?`)) return;
        if (noteModal.classList.contains("open")) closeExpandedEditor();
        if (moveModal.classList.contains("open")) closeMoveNote();

        localStorage.removeItem(storageKey);
        focusInput.value = "";
        eveningInput.value = "";
        notes = [];
        renderNotes();
        document.querySelectorAll("textarea[data-time]").forEach(box => {
          box.value = "";
          autoGrow(box);
        });
        markDateHasData(toKey(selectedDate));
        highlightCurrentTimeBlock();
      });

      todayBtn.addEventListener("click", () => {
        const today = getToday();
        if (isWithinRange(today)) selectDate(today, true);
      });

      sidebarToggle.addEventListener("click", () => {
        const collapsed = sidebar.classList.toggle("collapsed");
        shell.classList.toggle("left-collapsed", collapsed);
        sidebarToggle.textContent = collapsed ? "Show" : "Hide";
        sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      });

      notesToggle.addEventListener("click", () => {
        const collapsed = notesSidebar.classList.toggle("collapsed");
        shell.classList.toggle("right-collapsed", collapsed);
        notesToggle.textContent = collapsed ? "Show" : "Hide";
        notesToggle.setAttribute("aria-expanded", String(!collapsed));
      });

      window.addEventListener("resize", () => {
        document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
        document.querySelectorAll(".note-body").forEach(autoGrowNoteBody);
      });

      window.addEventListener("hashchange", () => {
        const hashDate = fromKey(location.hash.replace("#", ""));
        if (hashDate && isWithinRange(hashDate)) selectDate(hashDate, false);
      });

      buildCalendar();
      loadSelectedDate();
      history.replaceState(null, "", `#${toKey(selectedDate)}`);
      setInterval(highlightCurrentTimeBlock, 60000);
    })();
  </script>
</body>
</html>
