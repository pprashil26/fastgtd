<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeblocks</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --page: #fffdf8;
      --panel: #fbf7f0;
      --ink: #3d3a34;
      --muted: #8a8378;
      --line: #e7dfd4;
      --soft: #f1ebe2;
      --entry: #e8f0ec;
      --entry-border: #c8d8d0;
      --focus: #eef1e7;
      --evening: #f3ece7;
      --current: #fff3c7;
      --current-soft: #fff8df;
      --current-ink: #6f5b22;
      --selected: #dce8e1;
      --today: #f7e7bd;
      --accent: #7b9285;
      --saved-day: #eef5ee;
      --saved-day-border: #d4e3d8;
      --danger: #a56a62;
      --shadow: 0 10px 28px rgba(70, 55, 35, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.25;
      display: flex;
      justify-content: center;
      padding: 10px 8px;
    }

    .shell {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 230px minmax(0, 780px) 230px;
      gap: 10px;
      align-items: start;
      justify-content: center;
    }

    .sidebar,
    .notes-sidebar {
      width: 100%;
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: width 0.2s ease;
    }

    .sidebar-head,
    .notes-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px 7px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
    }

    .sidebar-title,
    .notes-title {
      font-size: 13px;
      font-weight: 650;
      color: var(--ink);
      white-space: nowrap;
    }

    .plain-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 1px 0;
      cursor: pointer;
    }

    .plain-btn:hover {
      text-decoration: underline;
    }

    .calendar-wrap {
      max-height: calc(100vh - 80px);
      overflow: auto;
      padding: 8px 8px 10px;
    }

    .month {
      margin-bottom: 11px;
    }

    .month-name {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 5px 2px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .weekday-row,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .weekday {
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      text-align: center;
      padding-bottom: 2px;
      user-select: none;
    }

    .day-spacer {
      min-height: 23px;
    }

    .day-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      min-height: 23px;
      border-radius: 999px;
      font: inherit;
      font-size: 11px;
      line-height: 1;
      padding: 2px 0;
      text-align: center;
      cursor: pointer;
    }

    .day-btn:hover {
      background: var(--soft);
      text-decoration: none;
    }

    .day-btn.weekend {
      color: var(--muted);
      background: rgba(231, 223, 212, 0.28);
    }

    .day-btn.has-data {
      background: var(--saved-day);
      border-color: var(--saved-day-border);
      color: var(--ink);
      font-weight: 650;
    }

    .day-btn.today {
      border-color: rgba(150, 120, 45, 0.38);
      background: var(--today);
      font-weight: 700;
    }

    .day-btn.selected {
      background: var(--selected);
      border-color: var(--entry-border);
      color: var(--ink);
      font-weight: 800;
    }

    .sidebar.collapsed,
    .notes-sidebar.collapsed {
      width: 42px;
    }

    .sidebar.collapsed .sidebar-head,
    .notes-sidebar.collapsed .notes-head {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .calendar-wrap,
    .notes-sidebar.collapsed .notes-title,
    .notes-sidebar.collapsed .notes-wrap {
      display: none;
    }

    /* Main page remains centred: collapsing sidebars does not change grid column widths. */
    .shell.left-collapsed,
    .shell.right-collapsed,
    .shell.left-collapsed.right-collapsed {
      grid-template-columns: 230px minmax(0, 780px) 230px;
    }

    .app {
      width: 100%;
      max-width: 780px;
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 9px 12px 7px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdf8 0%, #f8f3eb 100%);
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .selected-date {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11.5px;
    }

    .hint {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      white-space: nowrap;
    }

    .clear-btn,
    .delete-note-btn {
      color: var(--danger);
    }

    .note-block {
      padding: 6px 11px;
      border-bottom: 1px solid var(--line);
    }

    .note-block.bottom {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      background: var(--panel);
    }

    .note-line {
      display: grid;
      grid-template-columns: 68px 1fr;
      align-items: center;
      gap: 8px;
    }

    .note-label {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      user-select: none;
    }

    input[type="text"] {
      width: 100%;
      height: 27px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      padding: 5px 9px;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      background: #fffdf8;
    }

    input[type="text"]:focus {
      border-color: var(--entry-border);
      background: var(--soft);
    }

    #focusInput {
      background: var(--focus);
    }

    #eveningInput {
      background: var(--evening);
    }

    .timeline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
      padding: 6px 11px 7px;
    }

    .column {
      min-width: 0;
    }

    .column:first-child {
      border-right: 1px solid var(--line);
      padding-right: 12px;
    }

    .slot {
      display: grid;
      grid-template-columns: 58px 18px 1fr;
      min-height: 27px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .slot:last-child {
      border-bottom: 0;
    }

    .slot.current-slot {
      background: var(--current);
      box-shadow: inset 0 0 0 1px rgba(150, 120, 45, 0.16);
    }

    .slot.current-slot .time {
      color: var(--current-ink);
      font-weight: 750;
    }

    .slot.current-slot textarea {
      background: var(--current-soft);
    }

    .slot.drop-ok {
      background: #e9f4ea;
      box-shadow: inset 0 0 0 1px #bdd5c2;
    }

    .slot.drop-block {
      background: #f7ebe8;
      box-shadow: inset 0 0 0 1px #e2beb7;
    }

    .time {
      padding: 6px 8px 3px 2px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      text-align: right;
      user-select: none;
    }

    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      cursor: grab;
      user-select: none;
      opacity: 0.72;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    textarea {
      width: 100%;
      min-height: 26px;
      height: 26px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      padding: 5px 8px 4px;
      border-left: 1px solid var(--line);
      overflow: hidden;
    }

    textarea:focus {
      background: var(--soft);
    }

    textarea.has-text {
      background: var(--entry);
      border-left: 3px solid var(--entry-border);
      padding-left: 6px;
    }

    .slot.current-slot textarea.has-text {
      background: linear-gradient(0deg, rgba(232, 240, 236, 0.72), rgba(232, 240, 236, 0.72)), var(--current-soft);
    }

    footer {
      padding: 5px 12px 7px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10.5px;
      text-align: center;
      background: var(--panel);
    }

    .notes-wrap {
      padding: 8px;
    }

    .notes-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .notes-hint {
      color: var(--muted);
      font-size: 10.5px;
      margin: 0;
    }

    .note-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffdf8;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .note-title-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 8px 6px;
      border-bottom: 1px solid var(--line);
      background: #fbf7f0;
    }

    .note-title-input {
      height: 25px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 2px 0;
      font-size: 12.5px;
      font-weight: 650;
    }

    .note-title-input:focus {
      background: transparent;
    }

    .note-body {
      min-height: 92px;
      height: 92px;
      border-left: 0;
      resize: vertical;
      line-height: 24px;
      padding: 6px 9px;
      background-color: #fffdf8;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 23px,
        rgba(160, 145, 120, 0.24) 24px
      );
      overflow: auto;
    }

    .note-body:focus {
      background-color: #fffaf0;
    }

    /* Narrow desktop/tablet: keep layout usable and compact */
    @media (max-width: 1080px) and (min-width: 760px) {
      .shell,
      .shell.left-collapsed,
      .shell.right-collapsed,
      .shell.left-collapsed.right-collapsed {
        grid-template-columns: 210px minmax(0, 1fr) 210px;
      }

      .weekday {
        font-size: 9px;
      }
    }

    /* Mobile: sidebars stack above and below the planner. Inputs use 16px font to prevent iOS/Safari auto zoom. Drag/drop is disabled. */
    @media (max-width: 759px) {
      body {
        padding: 8px 6px;
      }

      .shell,
      .shell.left-collapsed,
      .shell.right-collapsed,
      .shell.left-collapsed.right-collapsed {
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }

      .sidebar,
      .notes-sidebar {
        width: 100%;
        border-radius: 14px;
      }

      .sidebar {
        order: 1;
        margin-bottom: 8px;
      }

      .app {
        order: 2;
        max-width: 100%;
        border-radius: 14px;
      }

      .notes-sidebar {
        order: 3;
        margin-top: 8px;
      }

      .sidebar.collapsed,
      .notes-sidebar.collapsed {
        width: 100%;
      }

      .sidebar.collapsed .sidebar-title,
      .notes-sidebar.collapsed .notes-title {
        display: block;
      }

      .sidebar.collapsed .calendar-wrap,
      .notes-sidebar.collapsed .notes-wrap {
        display: none;
      }

      .sidebar-head,
      .notes-head {
        padding: 8px 10px;
      }

      .calendar-wrap {
        max-height: 45vh;
      }

      .notes-wrap {
        padding: 8px;
      }

      .title-row {
        gap: 8px;
      }

      h1 {
        font-size: 17px;
      }

      .selected-date {
        font-size: 11.5px;
      }

      .toolbar {
        font-size: 11px;
      }

      .note-line {
        grid-template-columns: 56px 1fr;
      }

      .timeline {
        display: block;
        padding: 7px 10px 8px;
      }

      .column:first-child {
        border-right: 0;
        padding-right: 0;
      }

      .slot {
        grid-template-columns: 52px 1fr;
        min-height: 34px;
      }

      .drag-handle {
        display: none;
      }

      .time {
        font-size: 10.5px;
        padding-top: 9px;
      }

      input[type="text"],
      textarea {
        font-size: 16px;
      }

      input[type="text"] {
        height: 34px;
        padding: 5px 9px;
      }

      textarea {
        min-height: 34px;
        height: 34px;
        padding: 7px 8px 5px;
      }

      .note-title-input {
        height: 32px;
        font-size: 16px;
      }

      .note-body {
        min-height: 120px;
        line-height: 26px;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 25px,
          rgba(160, 145, 120, 0.24) 26px
        );
      }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Compact calendar sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">Calendar</div>
        <button class="plain-btn" id="sidebarToggle" type="button" aria-expanded="true" title="Show or hide calendar">Hide</button>
      </div>
      <div class="calendar-wrap" id="calendarWrap"></div>
    </aside>

    <main class="app" aria-label="Timeblocks daily planner">
      <header>
        <div class="title-row">
          <h1>Timeblocks</h1>
          <div class="selected-date" id="selectedDateText">Selected date</div>
        </div>
        <div class="toolbar">
          <div class="hint">8:00 AM to 8:00 PM · 30 min blocks</div>
          <div class="actions">
            <button class="plain-btn" id="todayBtn" type="button" title="Open today">Today</button>
            <button class="plain-btn clear-btn" id="clearBtn" type="button" title="Clear selected day's entries">Clear</button>
          </div>
        </div>
      </header>

      <section class="note-block" aria-label="Focus for the day">
        <div class="note-line">
          <label class="note-label" for="focusInput">Focus</label>
          <input id="focusInput" type="text" placeholder="Focus, critical reminder, intention..." autocomplete="off" />
        </div>
      </section>

      <section class="timeline" id="timeline"></section>

      <section class="note-block bottom" aria-label="Evening reminder">
        <div class="note-line">
          <label class="note-label" for="eveningInput">Evening</label>
          <input id="eveningInput" type="text" placeholder="Evening commitment, reminder..." autocomplete="off" />
        </div>
      </section>

      <footer>
        Select a date from the calendar. Current block highlights only for today. Saved automatically on this device.
      </footer>
    </main>

    <aside class="notes-sidebar" id="notesSidebar" aria-label="Lined notepad sidebar">
      <div class="notes-head">
        <div class="notes-title">Notepad</div>
        <button class="plain-btn" id="notesToggle" type="button" aria-expanded="true" title="Show or hide notepad">Hide</button>
      </div>
      <div class="notes-wrap">
        <div class="notes-top">
          <p class="notes-hint">Multiple notes. Saved with selected date.</p>
          <button class="plain-btn" id="addNoteBtn" type="button" title="Add note">+ Note</button>
        </div>
        <div id="notesList"></div>
      </div>
    </aside>
  </div>

  <script>
    (function () {
      const START_DATE = new Date(2026, 6, 1);  // 1 July 2026
      const END_DATE = new Date(2027, 11, 31);  // 31 December 2027
      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const shell = document.getElementById("shell");
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebarToggle");
      const notesSidebar = document.getElementById("notesSidebar");
      const notesToggle = document.getElementById("notesToggle");
      const calendarWrap = document.getElementById("calendarWrap");
      const timeline = document.getElementById("timeline");
      const selectedDateText = document.getElementById("selectedDateText");
      const clearBtn = document.getElementById("clearBtn");
      const todayBtn = document.getElementById("todayBtn");
      const focusInput = document.getElementById("focusInput");
      const eveningInput = document.getElementById("eveningInput");
      const addNoteBtn = document.getElementById("addNoteBtn");
      const notesList = document.getElementById("notesList");

      let selectedDate = getInitialDate();
      let storageKey = "";
      let saved = {};
      let notes = [];
      let draggedBox = null;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function toKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function fromKey(key) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
        if (!match) return null;
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        if (toKey(date) !== key) return null;
        return date;
      }

      function mondayFirstIndex(date) {
        return (date.getDay() + 6) % 7;
      }

      function isSameDay(a, b) {
        return a && b && toKey(a) === toKey(b);
      }

      function isWithinRange(date) {
        return date >= START_DATE && date <= END_DATE;
      }

      function getToday() {
        const current = new Date();
        return new Date(current.getFullYear(), current.getMonth(), current.getDate());
      }

      function getInitialDate() {
        const hashDate = fromKey(location.hash.replace("#", ""));
        if (hashDate && isWithinRange(hashDate)) return hashDate;

        const today = getToday();
        if (isWithinRange(today)) return today;

        return new Date(START_DATE);
      }

      function isDesktopDragEnabled() {
        return window.matchMedia("(min-width: 760px)").matches;
      }

      function selectedStorageKey() {
        return `timeblocks:${toKey(selectedDate)}`;
      }

      function monthName(date) {
        return date.toLocaleDateString(undefined, { month: "short", year: "numeric" });
      }

      function displayDate(date) {
        return date.toLocaleDateString(undefined, {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric"
        });
      }

      function formatTime(hour, minute) {
        const d = new Date();
        d.setHours(hour, minute, 0, 0);
        return d.toLocaleTimeString(undefined, {
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function createId() {
        return `note-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normalizeNotes(rawNotes) {
        if (Array.isArray(rawNotes)) {
          return rawNotes.map(note => ({
            id: note.id || createId(),
            title: note.title || "Untitled",
            body: note.body || ""
          }));
        }

        if (typeof rawNotes === "string" && rawNotes.trim()) {
          return [{
            id: createId(),
            title: "Note",
            body: rawNotes
          }];
        }

        return [];
      }

      function readSavedData() {
        storageKey = selectedStorageKey();
        try {
          saved = JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch (e) {
          saved = {};
        }
        notes = normalizeNotes(saved.notes);
      }

      function hasNotesData(data) {
        if (Array.isArray(data.notes)) {
          return data.notes.some(note => (note.title || "").trim() || (note.body || "").trim());
        }
        return Boolean((data.notes || "").trim());
      }

      function hasSavedDataForDate(key) {
        try {
          const data = JSON.parse(localStorage.getItem(`timeblocks:${key}`)) || {};
          const hasFocus = Boolean((data.focus || "").trim());
          const hasEvening = Boolean((data.evening || "").trim());
          const hasEntries = data.entries && Object.keys(data.entries).length > 0;
          const hasNotes = hasNotesData(data);
          return hasFocus || hasEvening || hasEntries || hasNotes;
        } catch (e) {
          return false;
        }
      }

      function collectNotes() {
        return Array.from(document.querySelectorAll(".note-card")).map(card => ({
          id: card.dataset.id,
          title: card.querySelector(".note-title-input").value,
          body: card.querySelector(".note-body").value
        }));
      }

      function save() {
        const data = {
          focus: focusInput.value,
          evening: eveningInput.value,
          notes: collectNotes(),
          entries: {}
        };

        document.querySelectorAll("textarea[data-time]").forEach(box => {
          if (box.value.trim()) data.entries[box.dataset.time] = box.value;
        });

        notes = data.notes;
        localStorage.setItem(storageKey, JSON.stringify(data));
        markDateHasData(toKey(selectedDate));
      }

      function markDateHasData(key) {
        const btn = document.querySelector(`.day-btn[data-date="${key}"]`);
        if (!btn) return;
        btn.classList.toggle("has-data", hasSavedDataForDate(key));
      }

      function autoGrow(box) {
        const minHeight = window.matchMedia("(max-width: 759px)").matches ? 34 : 26;
        box.style.height = minHeight + "px";
        box.style.height = Math.max(minHeight, box.scrollHeight) + "px";
        box.classList.toggle("has-text", box.value.trim().length > 0);
      }

      function autoGrowNoteBody(box) {
        const minHeight = window.matchMedia("(max-width: 759px)").matches ? 120 : 92;
        box.style.height = minHeight + "px";
        box.style.height = Math.max(minHeight, box.scrollHeight) + "px";
      }

      function clearDropClasses() {
        document.querySelectorAll(".slot.drop-ok, .slot.drop-block").forEach(slot => {
          slot.classList.remove("drop-ok", "drop-block");
        });
      }

      function createSlot(total) {
        const hour = Math.floor(total / 60);
        const minute = total % 60;
        const timeId = `${pad(hour)}:${pad(minute)}`;

        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.time = timeId;

        const label = document.createElement("div");
        label.className = "time";
        label.textContent = formatTime(hour, minute);

        const handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.textContent = "⋮⋮";
        handle.title = "Drag entry";
        handle.setAttribute("aria-hidden", "true");
        handle.draggable = true;

        const box = document.createElement("textarea");
        box.dataset.time = timeId;
        box.value = (saved.entries && saved.entries[timeId]) || saved[timeId] || "";
        box.placeholder = "Add...";
        box.setAttribute("aria-label", `Entry for ${label.textContent}`);

        handle.addEventListener("dragstart", function (event) {
          if (!isDesktopDragEnabled() || !box.value.trim()) {
            event.preventDefault();
            return;
          }
          draggedBox = box;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", box.dataset.time);
        });

        handle.addEventListener("dragend", function () {
          draggedBox = null;
          clearDropClasses();
        });

        slot.addEventListener("dragover", function (event) {
          if (!isDesktopDragEnabled() || !draggedBox) return;
          if (draggedBox === box) return;

          clearDropClasses();
          if (box.value.trim()) {
            slot.classList.add("drop-block");
            return;
          }

          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          slot.classList.add("drop-ok");
        });

        slot.addEventListener("dragleave", function () {
          slot.classList.remove("drop-ok", "drop-block");
        });

        slot.addEventListener("drop", function (event) {
          if (!isDesktopDragEnabled() || !draggedBox || draggedBox === box || box.value.trim()) {
            clearDropClasses();
            return;
          }

          event.preventDefault();
          box.value = draggedBox.value;
          draggedBox.value = "";
          autoGrow(draggedBox);
          autoGrow(box);
          save();
          clearDropClasses();
        });

        box.addEventListener("input", function () {
          autoGrow(box);
          save();
        });

        box.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            const boxes = Array.from(document.querySelectorAll("textarea[data-time]"));
            const index = boxes.indexOf(box);
            if (boxes[index + 1]) boxes[index + 1].focus();
          }
        });

        slot.appendChild(label);
        slot.appendChild(handle);
        slot.appendChild(box);
        return slot;
      }

      function buildTimeline() {
        timeline.innerHTML = "";
        const firstColumn = document.createElement("div");
        const secondColumn = document.createElement("div");
        firstColumn.className = "column";
        secondColumn.className = "column";

        // 30-minute blocks. Left: 8:00 AM to 1:30 PM. Right: 2:00 PM to 8:00 PM.
        for (let total = 8 * 60; total <= 20 * 60; total += 30) {
          const slot = createSlot(total);
          if (total < 14 * 60) {
            firstColumn.appendChild(slot);
          } else {
            secondColumn.appendChild(slot);
          }
        }

        timeline.appendChild(firstColumn);
        timeline.appendChild(secondColumn);
        document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
      }

      function createNoteCard(note) {
        const card = document.createElement("section");
        card.className = "note-card";
        card.dataset.id = note.id || createId();

        const titleRow = document.createElement("div");
        titleRow.className = "note-title-row";

        const title = document.createElement("input");
        title.className = "note-title-input";
        title.type = "text";
        title.value = note.title || "Untitled";
        title.placeholder = "Note title";
        title.setAttribute("aria-label", "Note title");

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "plain-btn delete-note-btn";
        deleteBtn.type = "button";
        deleteBtn.textContent = "Delete";
        deleteBtn.title = "Delete note";

        const body = document.createElement("textarea");
        body.className = "note-body";
        body.value = note.body || "";
        body.placeholder = "Write note...";
        body.setAttribute("aria-label", "Note body");

        title.addEventListener("input", save);
        body.addEventListener("input", function () {
          autoGrowNoteBody(body);
          save();
        });

        deleteBtn.addEventListener("click", function () {
          const ok = confirm("Delete this note?");
          if (!ok) return;
          card.remove();
          save();
        });

        titleRow.appendChild(title);
        titleRow.appendChild(deleteBtn);
        card.appendChild(titleRow);
        card.appendChild(body);
        return card;
      }

      function renderNotes() {
        notesList.innerHTML = "";
        notes.forEach(note => {
          notesList.appendChild(createNoteCard(note));
        });
        document.querySelectorAll(".note-body").forEach(autoGrowNoteBody);
      }

      function highlightCurrentTimeBlock() {
        document.querySelectorAll(".slot.current-slot").forEach(slot => {
          slot.classList.remove("current-slot");
        });

        const today = getToday();
        if (!isSameDay(selectedDate, today)) return;

        const current = new Date();
        const currentMinutes = current.getHours() * 60 + current.getMinutes();
        const startMinutes = 8 * 60;
        const endMinutes = 20 * 60;

        if (currentMinutes < startMinutes || currentMinutes > endMinutes) return;

        const roundedMinutes = Math.floor(currentMinutes / 30) * 30;
        const hour = Math.floor(roundedMinutes / 60);
        const minute = roundedMinutes % 60;
        const timeId = `${pad(hour)}:${pad(minute)}`;
        const currentSlot = document.querySelector(`.slot[data-time="${timeId}"]`);

        if (currentSlot) currentSlot.classList.add("current-slot");
      }

      function loadSelectedDate() {
        readSavedData();
        selectedDateText.textContent = displayDate(selectedDate);
        focusInput.value = saved.focus || "";
        eveningInput.value = saved.evening || "";
        buildTimeline();
        renderNotes();
        updateSelectedCalendarDay();
        highlightCurrentTimeBlock();
      }

      function selectDate(date, updateHash) {
        if (!isWithinRange(date)) return;
        selectedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        if (updateHash) {
          history.replaceState(null, "", `#${toKey(selectedDate)}`);
        }
        loadSelectedDate();
      }

      function updateSelectedCalendarDay() {
        const selectedKey = toKey(selectedDate);
        document.querySelectorAll(".day-btn.selected").forEach(btn => {
          btn.classList.remove("selected");
        });
        const btn = document.querySelector(`.day-btn[data-date="${selectedKey}"]`);
        if (btn) {
          btn.classList.add("selected");
          btn.scrollIntoView({ block: "nearest" });
        }
      }

      function addWeekdayHeader(month) {
        const weekdayRow = document.createElement("div");
        weekdayRow.className = "weekday-row";
        WEEKDAYS.forEach(dayName => {
          const dayHeader = document.createElement("div");
          dayHeader.className = "weekday";
          dayHeader.textContent = dayName;
          weekdayRow.appendChild(dayHeader);
        });
        month.appendChild(weekdayRow);
      }

      function addBlankDay(days) {
        const spacer = document.createElement("div");
        spacer.className = "day-spacer";
        spacer.setAttribute("aria-hidden", "true");
        days.appendChild(spacer);
      }

      function buildCalendar() {
        calendarWrap.innerHTML = "";
        const todayKey = toKey(getToday());
        let cursor = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);

        while (cursor <= END_DATE) {
          const month = document.createElement("section");
          month.className = "month";

          const heading = document.createElement("div");
          heading.className = "month-name";
          heading.textContent = monthName(cursor);

          const days = document.createElement("div");
          days.className = "days";

          const monthIndex = cursor.getMonth();
          const year = cursor.getFullYear();
          const firstDayOfMonth = new Date(year, monthIndex, 1);
          const day = new Date(year, monthIndex, 1);

          for (let i = 0; i < mondayFirstIndex(firstDayOfMonth); i += 1) {
            addBlankDay(days);
          }

          while (day.getMonth() === monthIndex) {
            if (day >= START_DATE && day <= END_DATE) {
              const key = toKey(day);
              const btn = document.createElement("button");
              btn.className = "day-btn";
              btn.type = "button";
              btn.textContent = day.getDate();
              btn.dataset.date = key;
              btn.title = displayDate(day);
              btn.setAttribute("aria-label", displayDate(day));

              if (day.getDay() === 0 || day.getDay() === 6) btn.classList.add("weekend");
              if (hasSavedDataForDate(key)) btn.classList.add("has-data");
              if (key === todayKey) btn.classList.add("today");
              if (key === toKey(selectedDate)) btn.classList.add("selected");

              btn.addEventListener("click", function () {
                const clickedDate = fromKey(this.dataset.date);
                if (clickedDate) selectDate(clickedDate, true);
              });

              days.appendChild(btn);
            } else {
              addBlankDay(days);
            }
            day.setDate(day.getDate() + 1);
          }

          month.appendChild(heading);
          addWeekdayHeader(month);
          month.appendChild(days);
          calendarWrap.appendChild(month);
          cursor.setMonth(cursor.getMonth() + 1);
        }
      }

      focusInput.addEventListener("input", save);
      eveningInput.addEventListener("input", save);

      addNoteBtn.addEventListener("click", function () {
        notes.push({
          id: createId(),
          title: "New Note",
          body: ""
        });
        renderNotes();
        save();
        const titles = notesList.querySelectorAll(".note-title-input");
        if (titles.length) titles[titles.length - 1].focus();
      });

      clearBtn.addEventListener("click", function () {
        const ok = confirm(`Clear all entries for ${displayDate(selectedDate)}?`);
        if (!ok) return;
        localStorage.removeItem(storageKey);
        focusInput.value = "";
        eveningInput.value = "";
        notes = [];
        renderNotes();
        document.querySelectorAll("textarea[data-time]").forEach(box => {
          box.value = "";
          autoGrow(box);
        });
        markDateHasData(toKey(selectedDate));
        highlightCurrentTimeBlock();
      });

      todayBtn.addEventListener("click", function () {
        const today = getToday();
        if (isWithinRange(today)) selectDate(today, true);
      });

      sidebarToggle.addEventListener("click", function () {
        const collapsed = sidebar.classList.toggle("collapsed");
        shell.classList.toggle("left-collapsed", collapsed);
        sidebarToggle.textContent = collapsed ? "Show" : "Hide";
        sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      });

      notesToggle.addEventListener("click", function () {
        const collapsed = notesSidebar.classList.toggle("collapsed");
        shell.classList.toggle("right-collapsed", collapsed);
        notesToggle.textContent = collapsed ? "Show" : "Hide";
        notesToggle.setAttribute("aria-expanded", String(!collapsed));
      });

      window.addEventListener("resize", function () {
        document.querySelectorAll("textarea[data-time]").forEach(autoGrow);
        document.querySelectorAll(".note-body").forEach(autoGrowNoteBody);
      });

      window.addEventListener("hashchange", function () {
        const hashDate = fromKey(location.hash.replace("#", ""));
        if (hashDate && isWithinRange(hashDate)) selectDate(hashDate, false);
      });

      buildCalendar();
      loadSelectedDate();
      history.replaceState(null, "", `#${toKey(selectedDate)}`);
      setInterval(highlightCurrentTimeBlock, 60000);
    })();
  </script>
</body>
</html>
